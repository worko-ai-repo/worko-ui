<div class="pay-card d-flex justify-content-center">
<div class="container">
 
  <!-- <form (ngSubmit)="paycard.form.valid && createCard()" #paycard="ngForm" novalidate > -->
     <form>
  <div class="row mt-3">
            
    <div class="col-md-12">
      <label class="form-lable">Cardholder Name</label>
      <input type="text" class="form-control form-input" placeholder="cardholderName"  name="cardholderName"  required
        >
    </div>
     </div>
     <div class="row mt-3">
    <div class="input-field col-md-12">
      <label class="form-lable">Cardholder number </label>
      <input type="text" class="form-control form-input" placeholder="cardholderNumber"  name="cardholderNumber"
       
      >
    </div>
    </div>
    <div class="row mt-3">
    <div class="input-field col-md-6">
      <label class="form-lable">valid date </label>
      <input type="text" class="form-control form-input" placeholder="MM/YYYY"  name="validyear" 
      
      >
    </div>
    <div class="input-field col-md-6">
      <label class="form-lable">CVV </label>
      <input type="text" class="form-control form-input" placeholder="CVV"  name="CVV" required maxlength="3"
     
      >
    </div>

    </div>

    <div class="row mt-3">
    <div class="input-field col-md-12">
      <label class="form-lable">Billing Address</label>
      <input type="text" id="billingAddress" name="billingAddress" class="form-control form-input">
    </div>
    </div>
    <div class="row mt-3">
    <div class="input-field col-md-12">
      <label for="zipCode" class="form-lable">Zip Code</label>
      <input type="text" id="zipCode" name="zipCode"  class="form-control form-input">
    </div>
    </div>
    <div class="row mt-3">
    <div class="input-field col-md-12">
      <label for="city" class="form-lable">City</label>
      <input type="text" id="city" name="city" class="form-control form-input">
    </div>
    </div>
  
    <div class="row mt-3 d-flex justify-content-center">
    <div class="submit-button">
      <button type="submit" class="btn-pay btn text-white col-md-12 ">Pay Now</button>
    </div>
</div>
  </form>
  </div>
</div>
