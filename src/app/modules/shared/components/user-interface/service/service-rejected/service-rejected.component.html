<div class="card candidate-card">
  <div class="card-body">
    <div class="container-fluid" style="height: 100%">
      <div class="row" style="height: 100%">
        <div class="col-md-3">
          <app-raise-issue
            [userType]="userType"
            (raiseIssue1)="referralRaiseIssue($event)"
          ></app-raise-issue>
        </div>

        <div
          class="col-md-12"
          style="
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
          "
        >
          <div class="col-md-12">
            <div class="col-md-12 pt-3 d-flex justify-content-center">
              <img
                src="/assets/public/service-rejected.png"
                class="service-reject"
                alt=""
              />
            </div>
            <div class="col-md-12 text-center pb-5">
              <h6 class="req-reject-content">
                Sorry, Your Request is Rejected!
              </h6>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
