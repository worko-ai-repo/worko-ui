                    <app-raise-issue [userType]="userType" (raiseIssue1)="referralRaiseIssue($event)"></app-raise-issue>
                </div>
                <div *ngIf="selectedReferral" class="col-md-3 p-0 m-0">
                    <app-mark-as-done [userType]="userType" (markAsDone1)="markAsDoneBtn()"
                        (referralRating1)="referralReviewRating($event)"
                        (cancelRatingPopup1)="cancelReviewRatingPopup()"></app-mark-as-done>
                </div>

<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="true"
    [showFooter]="showModal === modalType.MESSAGE" [modalSize]="'md'" [title]="modalTitle" [message]="modalMessage"
    [bodyClass]="modalMessage ? 'p-4' : 'p-0'">

    <ng-container *ngIf="showModal === modalType.CONFIRMATION_DIALOG">
        <app-confirmation-dialog-popup [action]="action" (onSuccess)="doneRequest()"
            (onCancel)="closeModal()"></app-confirmation-dialog-popup>
    </ng-container>

</app-modal>
