<form [formGroup]="rejectForm">
    <div class="candidate-card" style="border-radius: 6px;">
        <div class="row">
            <div class="card-content">
                <div class="warning-icon-div"
                    style="width: 100%; height: fit-content; display: flex; justify-content: center;">
                    <img src="assets/icons/warning_img.png" alt="" />
                </div>

                <h5 class="card-title mb-4">
                    Are You Sure you want to <br />
                    Reject this {{ userType === 'Employee' ? 'Request' : 'Job Application' }}?
                </h5>

                <div>
                    <h6 class="input-heading form-label required-form-field">Reason</h6>
                    <select style="width: 100%;" class="select-options p-2" formControlName="reason">
                        <!-- Placeholder -->
                        <option value="" disabled>Select option to reject</option>
                        <ng-container *ngIf="userType === 'Employee'; else corporateOptions">
                            <option value="Not a suitable profile">Not a suitable profile</option>
                            <option value="Opening has been closed">Opening has been closed</option>
                            <option value="Only for Internal hiring">Only for Internal hiring</option>
                            <option value="Others">Others</option>
                        </ng-container>
                        <ng-template #corporateOptions>
                            <option value="Salary Expectation Mismatch">Salary Expectation Mismatch</option>
                            <option value="Experience Expectation Mismatch">Experience Expectation Mismatch</option>
                            <option value="Educational Background Expectation Mismatch">Educational Background
                                Expectation
                                Mismatch</option>
                            <option value="Not From The Required Industry">Not From The Required Industry</option>
                            <option value="Position Went On Hold / Closed">Position Went On Hold / Closed</option>
                            <option value="Others">Others</option>
                        </ng-template>
                    </select>
                </div>

                <div class="mt-3">
                    <h6 class="input-heading form-label" [ngClass]="{ 'required-form-field': isCommentRequired }">
                        Comments
                    </h6>
                    <textarea style="width: 100%;" class="write-comment p-2" placeholder="Give your comment"
                        formControlName="comment"></textarea>
                </div>

                <div class="btn-div mt-3" style="width: 100%;">
                    <button class="btn-submit p-2" (click)="onSubmit()" [disabled]="!rejectForm.valid">
                        Reject
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
