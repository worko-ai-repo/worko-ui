<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">
    
        <div class="card-content">

            <div class="warning-icon-div" style="width: 100%; height: fit-content; display: flex; justify-content: center;">
                <img src="/assets/icons/warning_img.png" alt=""> 
            </div>

            <h5 class="card-title mb-4">Are You Sure you want to <br> Reject this Request?</h5>
          
            <div>
                <h6 for="" class="input-heading form-lable required-form-field">Reason</h6>
                <select style="width: 100%;" class="select-options p-2" [formControl]="reasonControl">
                    <option value="" disabled selected>Select option to reject</option>
                    <option value="Not a suitable profile">Not a suitable profile</option>
                    <option value="Opening has been closed">Opening has been closed</option>
                    <option value="Only for Internal hiring">Only for Internal hiring</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="mt-3">
                <div>
                    <h6 for="" class="input-heading form-lable required-form-field">Comments</h6>
                    <textarea style="width: 100%; color: white;" class="write-comment p-2" placeholder="Give your comment" [formControl]="comments"></textarea>
                </div>
            </div>

            <div class="btn-div mt-3" style="width: 100%;">
                <button class="btn-submit p-2" (click)="rejectSubmitBtn()" [disabled]="!reasonControl.valid || !comments.valid">Reject</button>
            </div>  

        </div>
        
    </div>
</div>
