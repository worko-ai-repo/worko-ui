    <div *ngIf="showCurrentJob">
      <div class="candidate-card">
        <div class="row">
          <div class="col-md-12">
            <div class="d-flex justify-content-between p-3 pb-2 border-line">
              <h5>Current Job</h5>
              <!-- <small (click)="toggleCard()">Past Job History <i class="fa-solid fa-arrow-right" style="color: #eeeff2;"></i></small> -->
            </div>
          </div>
          <div class="col-md-12 " >
            <div class="p-3 d-flex justify-content-between">
              <div>
                <div class="p-0">Company Name </div>
                <div class="company-text p-0" *ngFor="let workExperience of currentCompany">
                  {{workExperience.companyName}}
                  <!-- <span class="exp-text">Experience:{{workExperience.experienceInMonths}}</span> -->
                </div>
              </div>
              <div class="p-2">
                <img src="/assets/public/missing_company_logo_white.png" class="logo-img p-1" alt="">
              </div>
            </div>
          </div>
          <div class="col-md-12 job-details" *ngFor="let workExperience of currentCompany">
            <div class="p-3">
              <div class="d-flex justify-content-between ">
                <div>Official Email : {{workExperience.emailId}}</div>
                <div>department : {{workExperience.department}}</div>
               
              </div>
              <div class="d-flex justify-content-between ">
                <div>Experience : {{workExperience.experience}}</div>
                
                <div>Designation : {{workExperience.designation}}</div>
              </div>
              <!-- <div>Department : {{workExperience.department}}</div> -->
            </div>
          </div>
        </div>
      </div>
    </div>
