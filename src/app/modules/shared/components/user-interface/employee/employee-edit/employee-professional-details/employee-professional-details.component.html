<div class="" >
    <div class="card-body">
        <div class="row d-flex justify-content-center mt-5">

            <div class="col-md-4">
                <label for="" class="form-lable">Current Company Name</label>
                <input type="text" class="form-control form-input" placeholder="Company name" 
                     name="cname" id="cname">
            </div>

        </div>
        <div class="row d-flex justify-content-center mt-1">

            <div class="col-md-4">
                <label for="" class="form-lable">Officinal Email</label>
                <input type="text" class="form-control form-input" placeholder="123@Offcial.com" 
                     name="email" id="email">
            </div>

        </div>
        <div class="row d-flex justify-content-center mt-1">

            <div class="col-md-4">
                <label for="" class="form-lable">Designation</label>
                <input type="text" class="form-control form-input" placeholder="Designation" 
                     name="designation" id="designation">
            </div>

        </div>
        <div class="row d-flex justify-content-center mt-1">

            <div class="col-md-4">
                <label for="" class="form-lable">Department</label>
                <input type="text" class="form-control form-input" placeholder="Department" 
                     name="department" id="department">
            </div>

        </div>
        <div class="row d-flex justify-content-center mt-1">

            <div class="col-md-4">
                <label for="" class="form-lable">Working since</label>
                <input type="text" class="form-control form-input" placeholder="Working since" 
                     name="wsince" id="wsince">
            </div>

        </div>
        <div class="row mt-5 mb-3">
            <div class="col-md-11 d-flex justify-content-end">
                <!-- (click)="previousStep.emit()" -->
                <button class="btn btn-next me-2" (click)="onPreviousClick()">Previous</button>
                <button class="btn btn-next" (click)="onNextClick()">Next</button>
            </div>

        </div>


    </div>
</div>
