<div class="card-body pb-2 mb-2">

    
    <div class="row d-flex justify-content-center">
       <div class="row mb-3">
        <div class="col-md-5 ms-4"> <h5 class="ms-5" >Current Employee Details</h5></div>
       </div>
        <div class="col-md-5">
            <div>
                <label for="" class="form-lable">Current Company Name</label>
            <!-- <input type="text" class="form-control form-input" placeholder="Company name" 
                     name="cname" id="cname"  [(ngModel)]="employeeProfessionalData.companyName"> -->
            <input matInput #autoCompleteInput="matAutocompleteTrigger" class="form-control form-input"
                [formControl]="myControl" [matAutocomplete]="auto" placeholder="Select Company Name" />
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn"
                (optionSelected)="onOptionSelected($event)">
                <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                    {{ option.name }}
                </mat-option>
            </mat-autocomplete>
            </div>
           
        </div>
        <div class="col-md-5">
            <label for="" class="form-lable">Official Email</label>
            <input type="text" class="form-control form-input" placeholder="123@Offcial.com" name="email" id="email"
                [(ngModel)]="employeeProfessionalData.officialEmail">
        </div>

        <div class="col-md-5">
            <label for="" class="form-lable">Designation</label>
            <input type="text" class="form-control form-input" placeholder="Designation" name="designation"
                id="designation" [(ngModel)]="employeeProfessionalData.designation">
        </div>
        <div class="col-md-5">
            <label for="" class="form-lable">Department</label>
            <input type="text" class="form-control form-input" placeholder="Department" name="department"
                id="department" [(ngModel)]="employeeProfessionalData.department">
        </div>
        <div class="col-md-5">
            <label for="" class="form-lable">Working since</label>
            <input type="text" class="form-control form-input" placeholder="In months" name="wsince" id="wsince"
                [(ngModel)]="employeeProfessionalData.workingSince">
        </div>


    </div>

    <div class="row d-flex justify-content-center ">
       <div class="row mt-3">
        <div class="col-md-5  ms-4">
            <h5 class="ms-5" >Previous Employee Details</h5>
        </div>
       </div>
       

    </div>
   
    <div class="row mt-5 mb-3">
        <div class="col-md-11 d-flex justify-content-end">
            <!-- (click)="previousStep.emit()" -->
            <button class="btn btn-next me-2" (click)="onPreviousClick()">Previous</button>
            <button class="btn btn-next" (click)="updateProfessionalDetails()">Next</button>
        </div>

    </div>


</div>
