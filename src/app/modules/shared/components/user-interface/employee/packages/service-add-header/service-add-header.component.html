<app-modal [theme]="'theme-k'" [centered]="true" [showClose]= "true" [showHeader]="showModal === modalType.MESSAGE"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-5' : 'p-0'">

  <div class="row candidate-card ">
    <div class="col-md-12">
      <div class="row mt-4">
        <div class="col-md-4">
          <div class="d-flex justify-content-between">
            <h6 class="pe-0  ps-4 career-text">Booking Period</h6>
            <span class=""><b>-</b></span>
          </div>
          <h6 class="form-content-small pe-0 me-0 ps-4 m-0">
            How far in the future can <br />
            attendees book
          </h6>

        </div>

        <div class="col-md-8">
          <div class="">
            <select name="" id="" class="form-select selector me-2 ps-2 ms-2">
              <option value="">7 days</option>
              <option value="">15 days</option>
              <option value="">30 days</option>
              <option value="">45 days</option>
            </select>
          </div>
        </div>

        <div class="row mt-4">
          <div class="col-md-4">
            <div class="d-flex justify-content-between">
              <h6 class="pe-0  ps-4 career-text">Notice Period</h6>
              <span class=""><b>-</b></span>
            </div>

            <h6 class="form-content-small pe-0 me-0 ps-4 m-0">
              Set the minimum amount <br> of notice that is required
            </h6>
          </div>

          <div class="col-md-8">
            <div>
              <input type="text" class="selector-input me-2 ps-2 ms-3" placeholder="240" />
              <!-- <select name="" id="" class="input-time p-1 ps-2 pe-2">
                  <option value="" class="">Hours</option>
                </select> -->
              <h2 class="badge badge-primary" style="background: #57E1FF; padding: 9px;">Hours</h2>
            </div>
          </div>

  <div class="row mt-4">
  <div class="col-md-4 d-flex justify-content-between">
    <h6 class="availability-content ps-2">Choose Availability</h6>
    <span class="">-</span>
  </div>
  
</div>

<div class="row d-flex justify-content-center ms-3 mt-2" *ngFor="let data of availabilityList[0]?.availability let i = index">
  <div class="col-md-1 mt-2">
    <span class="ps-4"><input type="checkbox" [(ngModel)]="data.checkboxClicked" (click)="toggleCheckbox(i)" /></span>
  </div>
  <div class="col-md-2 ps-0 mt-2">
    <span class="d-flex justify-content-between">
      <span class="font-size-text">{{data.day}}</span>
      <span class=""><b>-</b></span>
    </span>
  </div>
  <div class="col-md-9 d-flex">
    <div class="d-flex">
<ng-container *ngIf="data.checkboxClicked; else unavailable">
  <div [formGroup]="selectForms[i]" class="col-md-6 d-flex mt-2">
    <div formArrayName="selectOptions">
      <!-- Iterate over the form controls -->
      <div *ngFor="let selectOption of getSelectOptionsFormArray(i).controls; let j = index">
        <!-- Check if there is a matching time slot for the current form control -->
        <div *ngIf="j < data.times.length">
          <!-- Access the correct time slot using the index 'j' -->
          <div [formGroupName]="j" class="d-flex">
            <select formControlName="startTime" style="background-image: none;" class="selector ps-2" [disabled]="!data.checkboxClicked" [ngModel]="convertIsoToTime(data.times[j]?.startTime)">
              <option value="" disabled selected hidden>From</option>
              <option *ngFor="let timing of timingOptions" [value]="timing.startTime" [selected]="timing.startTime === convertIsoToTime(data.times[j]?.startTime)">{{ timing.startTime }}</option>
            </select>
            <select formControlName="endTime" style="background-image: none;" class="selector ps-2 ms-3 me-0 pe-0" [disabled]="!data.checkboxClicked" (focus)="getSelectOptionsFormArray(i).controls[j].get('endTime')?.markAsTouched()" [ngModel]="convertIsoToTime(data.times[j]?.endTime)">
              <option value="" disabled selected hidden>To</option>
              <option *ngFor="let timing of timingOptions" [value]="timing.endTime" [selected]="timing.endTime === convertIsoToTime(data.times[j]?.endTime)">{{ timing.endTime }}</option>
            </select>
            <button class="ml-3 btn btn-add" type="button" (click)="addSelectOption(i)" [disabled]="!data.checkboxClicked && j === 0">+</button>
            <button type="button" (click)="removeSelectOption(i, j)" class="ml-3 btn btn-add" *ngIf="getSelectOptionsFormArray(i).controls.length > 1 && j !== 0">X</button>
          </div>
        </div>
        <!-- Handle the case when there is no matching time slot for the current form control -->
        <div *ngIf="j >= data.times.length" class="d-flex">
          <!-- Render empty form fields -->
          <div [formGroupName]="j" class="d-flex">
            <select formControlName="startTime" style="background-image: none;" class="selector ps-2" [disabled]="!data.checkboxClicked">
              <option value="" disabled selected hidden>From</option>
            </select>
            <select formControlName="endTime" style="background-image: none;" class="selector ps-2 ms-3 me-0 pe-0" [disabled]="!data.checkboxClicked">
              <option value="" disabled selected hidden>To</option>
            </select>
            <button class="ml-3 btn btn-add" type="button" (click)="addSelectOption(i)" [disabled]="!data.checkboxClicked && j === 0">+</button>
            <button type="button" (click)="removeSelectOption(i, j)" class="ml-3 btn btn-add" *ngIf="getSelectOptionsFormArray(i).controls.length > 1 && j !== 0">X</button>
          </div>
        </div>
        <div *ngIf="getSelectOptionsFormArray(i).controls[j].get('endTime')?.hasError('endTimeSameAsStartTime') && getSelectOptionsFormArray(i).controls[j].get('endTime')?.touched && getSelectOptionsFormArray(i).controls[j].get('endTime')?.value !== null" class="text-danger">
          End time cannot be the same as start time.
        </div>
      </div>
    </div>
  </div>
</ng-container>

      <ng-template #unavailable>
        <div class="col-md-6 mt-2">
          <span class="ps-4">Unavailable</span>
        </div>
        
      </ng-template>
    </div>
  </div>  
  <!-- Place the Apply Time to All button below Monday -->
  <ng-container *ngIf="data.day === 'Monday'">
    <div class="col-md-9 offset-md-10 d-flex mt-2" *ngIf="data.checkboxClicked">
      <button class="ml-3 btn btn-primary" type="button" (click)="applyTimeToAll()">Apply Time to All</button>
    </div>
  </ng-container>
</div>

          <div class="row d-flex justify-content-center mt-4 mb-3">
            <div class="col-md-4">
              <button class="save-btn float-end p-1 ps-5 pe-5">Save All</button>
            </div>
            <div class="col-md-8">
              <button class="float-end pause-btn p-1 ps-4 pe-4">Pause Service</button>
            </div>
          </div>





        </div>
      </div>
    </div>
  </div>





</app-modal>
