<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">


        <div *ngIf="userType === 'Candidate'" class="card-content">

            <h4 class="card-title mb-5">Raise Issue Here!</h4>

            <div>
                <!-- <h6 class="input-heading">Title</h6> -->
                <h6 for="" class="input-heading form-lable required-form-field">Title</h6>
                <select style="width: 100%;" [formControl]="selectedOption" class="select-options p-2">
                    <option value="" disabled selected>Select Issue</option>
                    <option value="Referee not responding">Referee not responding</option>
                    <option value="Rude behaviour">Rude behaviour</option>
                    <option value="Referral has not been done">Referral has not been done</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="mt-3">
                <div>
                    <!-- <h6 class="input-heading">Description</h6> -->
                    <h6 for="" class="input-heading form-lable required-form-field">Description</h6>
                    <textarea style="width: 100%;" class="write-issue p-2" placeholder="Write Issue!"
                        [formControl]="issueDescription"></textarea>
                </div>
            </div>

            <div class="mt-2">
                <button style="width: 100%;" class="btn-submit p-2" (click)="raiseIssueSubmitBtn()">Submit</button>
            </div>

        </div>

        <div *ngIf="userType === 'Employee'" class="card-content">

            <h4 class="card-title mb-4">Raise Issue Here!</h4>

            <div>
                <h6 class="input-heading">Title</h6>
                <select style="width: 100%;" [(ngModel)]="selectedOption" class="select-options p-2">
                    <option value="" disabled selected>Select Issue</option>
                    <option value="Behaviour not good">Behaviour not good</option>
                    <option value="Fake CV">Fake CV</option>
                    <option value="Not relevant experience">Not relevant experience</option>
                    <option value="Already applied earlier">Already applied earlier</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="mt-3">
                <div>
                    <h6 class="input-heading">Description</h6>
                    <textarea style="width: 100%;" class="write-issue p-2" placeholder="Write Issue!"
                        [formControl]="issueDescription"></textarea>
                </div>
            </div>

            <div class="mt-2">
                <button style="width: 100%;" class="btn-submit p-2" (click)="raiseIssueSubmitBtn()" [disabled]="!(selectedOption.valid && issueDescription.valid)">Submit</button>
            </div>

        </div>


    </div>
</div>
