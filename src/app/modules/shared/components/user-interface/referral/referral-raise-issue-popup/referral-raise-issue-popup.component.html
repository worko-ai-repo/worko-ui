<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">
    
        
        <div *ngIf="userType === 'Employee'" class="card-content">

            <h4 class="card-title mb-4">Raise Issue Here!</h4>
          
            <div>
                <div>
                  <h6 class="input-heading">Title</h6>
                  <input style="width: 100%;" class="write-title p-2" type="text" placeholder="Write Title!" [formControl]="issueTitle">
                </div>
            </div>

            <div class="mt-3">
                <div>
                    <h6 class="input-heading">Description</h6>
                    <textarea style="width: 100%;" class="write-issue p-2" placeholder="Write Issue!" [formControl]="issueDescription"></textarea>
                </div>
            </div>

            <div class="mt-2">
                <button style="width: 100%;" class="btn-submit p-2" (click)="raiseIssueSubmitBtn()">Submit</button>
            </div>  

        </div>

        <div *ngIf="userType === 'Candidate'" class="card-content">

            <h4 class="card-title mb-4">Raise Issue Here!</h4>
          
            <div>
                <div>
                  <h6 class="input-heading">Title</h6>
                  <input style="width: 100%;" class="write-title p-2" type="text" placeholder="Write Title!" [formControl]="issueTitle">
                </div>
            </div>

            <div class="mt-3">
                <div>
                    <h6 class="input-heading">Description</h6>
                    <textarea style="width: 100%;" class="write-issue p-2" placeholder="Write Issue!" [formControl]="issueDescription"></textarea>
                </div>
            </div>

            <div class="mt-2">
                <button style="width: 100%;" class="btn-submit p-2" (click)="raiseIssueSubmitBtn()">Submit</button>
            </div>  

        </div>

        
    </div>
</div>
