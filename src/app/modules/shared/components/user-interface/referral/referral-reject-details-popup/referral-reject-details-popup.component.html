<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">
        <div class="card-content">
            <h4 class="card-title mb-4">Request Rejected</h4>

            <div class="mt-4">
                <h6 class="input-heading">Reason</h6>
                <div class="reason-box p-2">
                    <p class="reason-text">{{rejectReasonsData?.reason}}</p>
                </div>
            </div>

            <div class="mt-4">
                <h6 class="input-heading">Comment</h6>
                <div class="reason-box p-2">
                    <p class="comment-text" 
                       [ngClass]="{'no-comment': !getUserComment(rejectReasonsData)}">
                        {{ getUserComment(rejectReasonsData) || 'No comments provided' }}
                    </p>
                </div>
            </div>
            

            <div class="mt-4 btn-div">
                <button class="btn-submit" (click)="closePopup()">Close</button>
            </div>
        </div>
    </div>
</div>
