<div class="card candidate-card" style="border-radius: 6px;">
    <div class="card-body mb-4" >

        <div class="row" style="height: 100%;">


            <div class="row d-flex justify-content-center">
                <div class="col-md-11 mt-5">
                    <div class="col-md-12 mt-2">
                        <h5 class="req-rejected pt-2">Request Rejected</h5>
                    </div>
                    <div class="col-md-3 ps-4 pt-3 d-flex justify-content-center">
                        <h6 class="req-content">Reason</h6>
                    </div>
                    <div class="row d-flex justify-content-center">
                        <div class="col-md-10">
                            <div class="reason-box">
                                <h6 class="yourExperience-content pt-3 ps-4">
                                    Your experience is not sufficient to Job applied!
                                </h6>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-3 ms-5 mt-4">
                        <h6 class="req-content">Comment</h6>
                    </div>
                    <div class="row d-flex justify-content-center">
                        <div class="col-md-10">
                            <div class="reason-box">
                                <h6 class="comment-content pt-3 ps-4">
                                    Jorem ipsum dolor sit amet, consectetur adipiscing
                                    elit. Nunc vulputate libero et velit interdum, ac
                                    aliquet odio mattis. Class aptent taciti sociosqu ad
                                    litora torquent per conubia nostra, per inceptos
                                    himenaeos.
                                </h6>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12 d-flex justify-content-center mt-3 mb-3">
                            <button class="button-close" (click)="closePopup()">Close</button>
                        </div>
                    </div>
                </div>
            </div>


        </div>
    </div>
</div>
