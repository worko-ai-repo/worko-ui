<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">

        <div class="card-content">
            <div class="popup-card">

                <div style="display: flex; justify-content: center; text-align: center;">
                    <h6 style="font-size: 18px;" class="mt-2">How do you rated this request</h6>
                </div>

                <div class="review-rating">
                    <ngb-rating [max]="5" [rate]="finalRating" [readonly]="true"></ngb-rating>
                </div>

                <div class="review-comments mt-3">
                    <h6 style="color: gray; font-size: 16px; text-align: center;">It was a great service.</h6>
                </div>

                <div class="mt-3">
                    <button class="btn-submit" (click)="closePopup()">Close</button>
                </div>

            </div>
        </div>


    </div>
</div>
