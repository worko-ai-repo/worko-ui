<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">

        <div *ngIf="userType === 'Candidate'" class="card-content">
            <div class="popup-card">

                <div>
                    <div style="display: flex; justify-content: center; text-align: center;">
                        <h6 style="font-size: 18px;" class="mt-2">How did you rate your referee</h6>
                    </div>

                    <div class="review-rating" *ngIf="ratingForEmp">
                        <ngb-rating [max]="5" [rate]="ratingForEmp" [readonly]="true"></ngb-rating>
                    </div>

                    <div class="review-comments mt-3" *ngIf="reviewTextForEmp">
                        <h6 style="color: gray; font-size: 16px; text-align: center;">{{reviewTextForEmp}}</h6>
                    </div>

                    <div class="review-rating" *ngIf="!ratingForEmp">
                        <ngb-rating [max]="5" [rate]="finalRating" [readonly]="true"></ngb-rating>
                    </div>

                    <div class="review-comments mt-3" *ngIf="!reviewTextForEmp">
                        <h6 style="color: gray; font-size: 16px; text-align: center;">{{noReviewReceived}}</h6>
                    </div>

                </div>

                <hr>

                <div style="display: flex; justify-content: center; text-align: center;">
                    <h6 style="font-size: 18px;" class="mt-2">How has your referee rated you</h6>
                </div>

                <div class="review-rating" *ngIf="ratingForCand">
                    <ngb-rating [max]="5" [rate]="ratingForCand" [readonly]="true"></ngb-rating>
                </div>

                <div class="review-comments mt-3" *ngIf="reviewTextForCand">
                    <h6 style="color: gray; font-size: 16px; text-align: center;">{{reviewTextForCand}}</h6>
                </div>

                <div class="review-rating" *ngIf="!ratingForCand">
                    <ngb-rating [max]="5" [rate]="finalRating" [readonly]="true"></ngb-rating>
                </div>

                <div class="review-comments mt-3" *ngIf="!reviewTextForCand">
                    <h6 style="color: gray; font-size: 16px; text-align: center;">{{noReviewReceived}}</h6>
                </div>

                <div class="mt-3">
                    <button class="btn-submit" (click)="closePopup()">Close</button>
                </div>

            </div>

        </div>

        <div *ngIf="userType === 'Employee'" class="card-content">
            <div class="popup-card">

                <div style="display: flex; justify-content: center; text-align: center;">
                    <h6 style="font-size: 18px;" class="mt-2">How did you rate your referral</h6>
                </div>

                <div class="review-rating" *ngIf="ratingForCand">
                    <ngb-rating [max]="5" [rate]="ratingForCand" [readonly]="true"></ngb-rating>
                </div>

                <div class="review-comments mt-3" *ngIf="reviewTextForCand">
                    <h6 style="color: gray; font-size: 16px; text-align: center;">{{reviewTextForCand}}</h6>
                </div>

                <div class="review-rating" *ngIf="!ratingForCand">
                    <ngb-rating [max]="5" [rate]="finalRating" [readonly]="true"></ngb-rating>
                </div>

                <div class="review-comments mt-3" *ngIf="!reviewTextForCand">
                    <h6 style="color: gray; font-size: 16px; text-align: center;">{{noReviewReceived}}</h6>
                </div>

                <hr>

                <div>
                    <div style="display: flex; justify-content: center; text-align: center;">
                        <h6 style="font-size: 18px;" class="mt-2">How has your referral rated you</h6>
                    </div>

                    <div class="review-rating" *ngIf="ratingForEmp">
                        <ngb-rating [max]="5" [rate]="ratingForEmp" [readonly]="true"></ngb-rating>
                    </div>

                    <div class="review-comments mt-3" *ngIf="reviewTextForEmp">
                        <h6 style="color: gray; font-size: 16px; text-align: center;">{{reviewTextForEmp}}</h6>
                    </div>

                    <div class="review-rating" *ngIf="!ratingForEmp">
                        <ngb-rating [max]="5" [rate]="finalRating" [readonly]="true"></ngb-rating>
                    </div>

                    <div class="review-comments mt-3" *ngIf="!reviewTextForEmp">
                        <h6 style="color: gray; font-size: 16px; text-align: center;">{{noReviewReceived}}</h6>
                    </div>

                    <div class="mt-3">
                        <button class="btn-submit" (click)="closePopup()">Close</button>
                    </div>

                </div>

            </div>

        </div>


    </div>
</div>
