<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">

        <div class="card-content">

            <h4 class="card-title mb-4">Withdraw Referral Request!</h4>

            <div>
                <h6 class="input-heading">Reason<span style="color: white;">*</span></h6>
                <select style="width: 100%;" class="select-options p-2" [formControl]="reasonControl">
                    <option value="" disabled selected>Select Reason</option>
                    <option value="Got referral from somewhere else">Got referral from somewhere else</option>
                    <option value="Don’t want to pursue this role">Don’t want to pursue this role</option>
                    <option value="Got job already">Got job already</option>
                    <option value="Raised by Mistake">Raised by Mistake</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div class="mt-3">
                <div>
                    <h6 class="input-heading">Comments</h6>
                    <textarea style="width: 100%; color: white;" class="write-comment p-2"
                        placeholder="Give your comment" [formControl]="comments"></textarea>
                </div>
            </div>

            <div class="btn-div mt-3" style="width: 100%;">
                <button class="btn-submit p-2" (click)="withdrawSubmitBtn()" [disabled]="!reasonControl.valid">Submit</button>
            </div>

        </div>

    </div>
</div>
