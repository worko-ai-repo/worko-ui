<div class="candidate-card" style="border-radius: 6px;"> 
    <div class="row">

        <div class="card-content">
            <div class="popup-card">

                <div style="display: flex; justify-content: center; text-align: center;">
                    <h6 style="font-size: 20px; text-decoration: underline;" class="mt-2">Detailed Analysis</h6>
                </div>

                <div class="mt-5" style="width: 100%;">
                    <div *ngIf="scoreDetails" style="display: flex; justify-content: center;">
                        <code [innerHTML]="scoreDetails" class="white-text"></code>
                    </div>
                </div>

                <div class="mt-5" style="width: 100%; display: flex; justify-content: center;">
                    <button class="btn-cancel" (click)="cancelBtn()">Close</button>
                </div>

            </div>
        </div>


    </div>
</div>
