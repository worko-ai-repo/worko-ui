<div class="candidate-card" style="border-radius: 6px;">
    <div class="row">

        <div *ngIf="userType === 'Candidate'" class="card-content">
            <div class="popup-card">

                <div style="display: flex; justify-content: center; text-align: center;">
                    <h6 style="font-size: 20px;" class="mt-2">How do you rate this request?</h6>
                </div>

                <div class="review-rating">
                    <ngb-rating [max]="5" (click)="getRating()" [formControl]="ratingControl"></ngb-rating>
                </div>

                <div class="mt-3" style="width: 100%;">
                    <textarea class="write-review p-2" placeholder="Write Review!!"
                        [formControl]="reviewControl"></textarea>
                </div>

                <div class="mt-3" style="width: 100%; display: flex; justify-content: space-between;">
                    <button class="btn-submit" (click)="submitReviewRating()"
                        [class.btn-disabled]="ratingControl.invalid" [disabled]="ratingControl.invalid">Submit
                    </button>
                    <button class="btn-cancel" (click)="cancelBtn()">Cancel</button>
                </div>

            </div>
        </div>

        <div *ngIf="userType === 'Employee'" class="card-content">
            <div class="popup-card">

                <div style="display: flex; justify-content: center; text-align: center;">
                    <h6 style="font-size: 20px;" class="mt-2">How do you rate your referred candidate?</h6>
                </div>

                <div class="review-rating">
                    <ngb-rating [max]="5" (click)="getRating()" [formControl]="ratingControl"></ngb-rating>
                </div>

                <div class="mt-3" style="width: 100%;">
                    <textarea class="write-review p-2" placeholder="Write Review!!"
                        [formControl]="reviewControl"></textarea>
                </div>

                <div class="mt-3" style="width: 100%; display: flex; justify-content: space-between;">
                    <button class="btn-submit" (click)="submitReviewRating()"
                        [class.btn-disabled]="ratingControl.invalid" [disabled]="ratingControl.invalid">Submit
                    </button>
                    <button class="btn-cancel" (click)="cancelBtn()">Cancel</button>
                </div>

            </div>
        </div>


    </div>
</div>
