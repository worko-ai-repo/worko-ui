<div class="candidate-card mt-2">
    <div class="row">
    
        
        <div *ngIf="userType === 'Employee'" class="row d-flex justify-content-center mb-5">
            <div class="col-md-8 mt-3">
                <div class="popup-card">
                        <div class="row mt-4 mb-4">
                            <div class="col-md-12">
                                <h6 class="mt-2">How do you rate <br> 
                                    Candidate?</h6>
                            </div>
                            <div class="col-md-12">
                              <ngb-rating [max]="5" (click)="getRating()" [formControl]="ratingControl"></ngb-rating>
                            </div>

                            <div class="col-md-12 mt-2">
                                <textarea class="write-review p-2" placeholder="Write Review!"></textarea>
                            </div>
                            <div class="col-md-12 mt-2 mb-3">
                                <button class="btn-submit">Submit</button>
                            </div>
                        </div>
                </div>
            </div>
        </div>

        <div *ngIf="userType === 'Candidate'" class="row d-flex justify-content-center mb-5">
          <div class="col-md-8 mt-3">
              <div class="popup-card">
                      <div class="row mt-4 mb-4">
                          <div class="col-md-12">
                              <h6 class="mt-2">How do you rate <br> 
                                  this request?</h6>
                          </div>
                          <div class="col-md-12">
                            <ngb-rating [max]="5" (click)="getRating()" [formControl]="ratingControl"></ngb-rating>
                          </div>

                          <div class="col-md-12 mt-2">
                              <textarea class="write-review p-2" placeholder="Write Review!" [formControl]="reviewControl"></textarea>
                          </div>
                          <div class="col-md-12 mt-2 mb-3">
                              <button class="btn-submit" (click)="submitReview()">Submit</button>
                          </div>
                      </div>
              </div>
          </div>
      </div>

        
    </div>
</div>
