<div class="card candidate-card">
    <div class="card-body px-0">
        <div class="d-flex">
            <div class="col-md-6">
                <div class="dropdown">
                    <button class="dropdown-toggle text-capitalize" type="button" id="dropdownMenu2"
                        data-toggle="dropdown" aria-expanded="false">
                        {{selectedStatus }}
                    </button>
                    

                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu2">
                        <li><button class="dropdown-item" type="button"
                                (click)="onSelectStatus('AWAITING')">Awaiting</button></li>
                        <li><button class="dropdown-item" type="button"
                                (click)="onSelectStatus('ACCEPTED')">Accepted</button></li>
                        <li><button class="dropdown-item" type="button"
                                (click)="onSelectStatus('REJECTED')">Rejected</button></li>
                        <li><button class="dropdown-item" type="button"
                                (click)="onSelectStatus('CANCELLED')">Cancelled</button></li>
                        <li style="border-bottom: none;"><button class="dropdown-item" type="button" (click)="onSelectStatus('DONE')">Done</button>
                        </li>
                    </ul>
                </div>

            </div>
            <!-- <div class="col-md-6">
                <input type="search" class="search-input form-control">
            </div> -->
        </div>

        <!-- Repeat this block for each card -->
        <div class="d-flex referral-list" *ngFor="let referral of referralList" [ngClass]="{'referral-list-clicked-item': referral.SK === selectedReferralSK}">
            <div class="d-flex" (click)="showReferralData(referral) ">

           
            <div class="d-flex align-items-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 19 19" fill="none">
                    <path
                        d="M5.05276 15.0983L1.59314 18.558C1.00523 19.1459 0 18.7295 0 17.8981V2.96622C0 1.41998 1.25348 0.166504 2.79972 0.166504H15.8651C17.4113 0.166504 18.6648 1.41998 18.6648 2.96622V12.2986C18.6648 13.8449 17.4113 15.0983 15.8651 15.0983H5.05276Z"
                        fill="white" />
                </svg>
            </div>
            <div class=" text-size">
                <h5 class="m-0 p-0">Referral Request</h5>
                <span class="p-0 m-0">Requested On {{ referral.createdAt | date:'MMM dd, yyyy' }} </span>
            </div>
            <div class="number-size">
                <div class="text-overflow" title="#{{getSlicedValue(referral.SK)}}">
                   #{{getSlicedValue(referral.SK)}}
                </div>
            </div>
        </div>
        </div>
        <!-- End of repeated block -->
        <!-- Repeat the above block for each card as needed -->
    </div>
</div>
