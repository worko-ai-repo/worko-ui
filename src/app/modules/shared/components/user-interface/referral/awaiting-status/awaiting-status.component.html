<div class="container-fluid">
    <div class="row">
        <div class="col-md-12">

            <div class="card candidate-card">
                <div class="card-body">
                    <div class="container-fluid">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="dropdown">
                                    <button class="dropdown-toggle" type="button" id="dropdownMenu2" data-toggle="dropdown" aria-expanded="false">
                                        Awaiting
                                    </button>
                                    <ul class="dropdown-menu" aria-labelledby="dropdownMenu2">
                                        <li><button class="dropdown-item" type="button">Awaiting </button></li>
                                        <li><button class="dropdown-item" type="button">Accepted</button></li>
                                        <li><button class="dropdown-item" type="button">Rejected</button></li>
                                        <li><button class="dropdown-item" type="button">Cancelled</button></li>
                                        <li><button class="dropdown-item" type="button">Done</button></li>
                                    </ul>
                                </div>
                                <!-- <select name="" id="" class="selector">
                                    <option value="" class="dropdown-menu">Awaiting</option>
                                    <option value="" class="dropdown-menu">Accepted</option>
                                    <option value="" class="dropdown-menu">Rejected</option>
                                    <option value="" class="dropdown-menu">Cancelled</option>
                                    <option value="" class="dropdown-menu">Done</option>

                                </select> -->
                            </div>
                            <div class="col-md-6">
                                <input type="search" class="search-input form-control">
                            </div>
                        </div>

                        <!-- Repeat this block for each card -->
                        <div class="row" *ngFor="let referral of referralRequests">
                            <div class="col-md-2 col-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 19 19" fill="none">
                                    <path d="M5.05276 15.0983L1.59314 18.558C1.00523 19.1459 0 18.7295 0 17.8981V2.96622C0 1.41998 1.25348 0.166504 2.79972 0.166504H15.8651C17.4113 0.166504 18.6648 1.41998 18.6648 2.96622V12.2986C18.6648 13.8449 17.4113 15.0983 15.8651 15.0983H5.05276Z" fill="white"/>
                                  </svg>
                            </div>
                            <div class="col-md-7 col-6 text-size">
                                <h5 class="m-0 p-0">{{referral.title}}</h5>
                                <span class="p-0 m-0">Date{{referral.date}}</span>
                            </div>
                            <div class="col-md-3 col-3 number-size">
                                <h5>{{referral.number}}</h5>
                            </div>
                            <hr class="line-color">
                        </div>
                        
                        
                        <!-- End of repeated block -->

                        <!-- Repeat the above block for each card as needed -->

                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
