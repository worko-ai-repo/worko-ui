<div class="cardidate-card py-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>Get Referral for Any Job in {{companyName}}</span>
        <div class="svg-circle">
        <svg width="39" height="49" viewBox="0 0 59 69" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17.209 37.375L29.5007 51.75L41.7923 37.375M17.209 17.25L29.5007 31.625L41.7923 17.25" stroke="#020202" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        </div>
    </div>
    
    <div class="form-group">
        <label for="job-url">Paste Job URL for Any Open Role Here:</label>
        <input type="text" id="job-url">
    </div>
    
    <div class="form-group">
        <label for="job-description">Paste Job Description for Above URL here:</label>
        <textarea id="job-description" class="job-description" rows="4" ></textarea>
    </div>
    
    <div class="button-class mt-4 d-flex justify-content-center align-items-center col-md-12">
        <button class="btn btn-next">Request Referral</button>
    </div>
</div>
