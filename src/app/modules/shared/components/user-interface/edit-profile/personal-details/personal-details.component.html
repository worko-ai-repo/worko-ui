                <div class="row d-flex justify-content-center mt-2">
                    <div class="col-md-8">
                        <label class="form-check-label text-center">
                            <input class="" type="checkbox" [checked]="candidateProfessionalDetails.isCandidateFresher"
                                (click)="userFresher()" [disabled]="isDisabled"> Are you a fresher ?
                        </label>
                    </div>
                </div>
                <div class="row d-flex justify-content-center mt-2"
                    *ngIf="!candidateProfessionalDetails.isCandidateFresher">
                    <div class="col-md-2">
                        <label for="" class="form-label required-form-field">Year Of Experience</label>
                        <input type="text" class="form-control form-ctc" placeholder="Year Of Experience"
                            pattern="^\d{1,3}(?:,\d{3})*(?:\.\d{1,2})?$" #yoe="ngModel" required
                            [title]="yoe.errors?.['pattern'] ? 'Year Of Experience is invalid' : ''"
                            [title]="yoe.errors?.['required'] ? 'Year Of Experience is required' : ''"
                            [ngClass]="{ 'is-invalid': yoe.invalid && (yoe.dirty || yoe.touched) }"
                            [(ngModel)]="candidateProfessionalDetails.yoe" name="yoe" id="yoe">


                    </div>
                    <div class="col-md-3 ">
                        <label for="" class="form-label required-form-field">Current / Last Company Name</label>
                        <input matInput #autoCompleteInput="matAutocompleteTrigger" class="form-control form-ctc"
                            [formControl]="myControl" [matAutocomplete]="auto" placeholder="Select Company Name"
                            required [(ngModel)]="candidateProfessionalDetails.companyName" />
                        <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayFn"
                            (optionSelected)="onOptionSelected($event)">
                            <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
                                {{ option.name }}
                            </mat-option>
                        </mat-autocomplete>
                    </div>
                    <div class="col-md-3">
                        <label for="" class="form-label  required-form-field">Designation</label>
                        <input type="text" class="form-control form-ctc" placeholder="Designation"
                            #designation="ngModel" required pattern="^[A-Za-z\s!@#$%^&*()\/.,\-]+$" minlength="4"
                            maxlength="30" [title]="designation.errors?.['pattern'] ? 'designation is invalid' : ''"
                            [title]="designation.errors?.['required'] ? 'designation is required':''"
                            [ngClass]="{ 'is-invalid': designation.invalid && (designation.dirty || designation.touched) }"
                            [(ngModel)]="candidateProfessionalDetails.designation" name="designation" id="designation">
                    </div>
                    <!-- <div class="col-md-2">
                        <label for="" class="form-label  required-form-field">Department</label>

                </div>

                <div class="row d-flex justify-content-center mt-2"
                    *ngIf="!candidateProfessionalDetails.isCandidateFresher">
                    <div class="col-md-2">
                        <label for="" class="form-label  required-form-field">Department</label>
                        <input type="text" class="form-control form-ctc" placeholder="Department" #Department="ngModel"
                            required pattern="^[A-Za-z\s!@#$%^&*()\/.,\-]+$" maxlength="30"
                            [title]="Department.errors?.['pattern'] ? 'Department is invalid' : ''"
                            [title]="Department.errors?.['required'] ? 'Department is required':''"
                            [ngClass]="{ 'is-invalid': Department.invalid && (Department.dirty || Department.touched) }"
                            [(ngModel)]="candidateProfessionalDetails.department" name="department" id="department">
                    </div>
                    <div class="col-md-2">
                        <label for="" class="form-label  required-form-field">CTC</label>
                        <input type="text" class="form-control form-ctc" placeholder="CTC(in LPA)"
                            pattern="^(?!0*\.?0*$)0*([1-9][0-9]*)(\.[0-9]{1,2})?$" #ctc="ngModel" required
                            [title]="ctc.errors?.['pattern'] ? 'CTC is invalid' : ''"
                            [title]="ctc.errors?.['required'] ? 'CTC is required' : ''"
                            [ngClass]="{ 'is-invalid': ctc.invalid && (ctc.dirty || ctc.touched) }"
                            [(ngModel)]="candidateProfessionalDetails.ctc" name="ctc" id="ctc">
                    </div>
                    <div class="col-md-2">
                        <label for="" class="form-label  required-form-field">ECTC</label>
                        <input type="text" class="form-control form-ctc" placeholder="Expected CTC(in LPA)"
                            pattern="^(?!0*\.?0*$)0*([1-9][0-9]*)(\.[0-9]{1,2})?$" #ectc="ngModel" required
                            [title]="ectc.errors?.['pattern'] ? 'Expected CTC is invalid' : ''"
                            [title]="ectc.errors?.['required'] ? 'Expected CTC is required' : ''"
                            [ngClass]="{ 'is-invalid': ectc.invalid && (ectc.dirty || ectc.touched) }"
                            [(ngModel)]="candidateProfessionalDetails.ectc" name="ectc" id="ectc">
                    </div>
                    <div class="col-md-2">
                        <label for="" class="form-label  required-form-field">Notice period</label>
                        <input type="text" class="form-control form-ctc" placeholder="Notice period(In days)"
                            pattern="[0-9]+" #noticePeriod="ngModel" required
                            [title]="noticePeriod.errors?.['pattern'] ? 'Notice Period is invalid' : ''"
                            [title]="noticePeriod.errors?.['required'] ? 'Notice Period is required' : ''"
                            [ngClass]="{ 'is-invalid': noticePeriod.invalid && (noticePeriod.dirty || noticePeriod.touched) }"
                            [(ngModel)]="candidateProfessionalDetails.noticePeriod" name="noticePeriod"
                            id="noticePeriod">

                    </div>

                </div>

                <div class="row d-flex justify-content-center mt-2">
                    <div class="col-md-8">
                        <label for="" class="form-lable core-skills-lable ps-2 required-form-field">Soft skills</label>
                        <div class="certific-skill-box" (click)="focusInput()">
                            <div class="skill-container">
                                <div *ngFor="let softSkill of candidateProfessionalDetails.softSkills">
                                    <div class=" m-1 text-in-box">{{softSkill.skillName}}
                                        <span class="text-in-box-close-icon"
                                            (click)="removeSoftSkill(softSkill.skillName)">
                                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                                xmlns="http://www.w3.org/2000/svg">
                                                <path
                                                    d="M8 0.125C3.6125 0.125 0.125 3.6125 0.125 8C0.125 12.3875 3.6125 15.875 8 15.875C12.3875 15.875 15.875 12.3875 15.875 8C15.875 3.6125 12.3875 0.125 8 0.125ZM11.0375 11.9375L8 8.9L4.9625 11.9375L4.0625 11.0375L7.1 8L4.0625 4.9625L4.9625 4.0625L8 7.1L11.0375 4.0625L11.9375 4.9625L8.9 8L11.9375 11.0375L11.0375 11.9375Z"
                                                    fill="#0A1E35" />
                                            </svg>
                                        </span>
                                    </div>

                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-12">
                                    <div class="tooltip-container">
                                        <div class="tooltip-style">
                                            <i class="fa-solid fa-circle-info"></i>
                                        </div>
                                        <div class="tooltip-text pt-2 text-center ">
                                            <small>Press Enter to add a soft skill</small>
                                        </div>
                                    </div>
                                    <!-- Move the input field below the tooltip -->
                                    <input #softSkillInput class=" borderless-field form-control  soft-skill-input"
                                        type="text" (keydown.enter)="addSoftSkill($event)" (blur)="addSoftSkill($event)"
                                        placeholder="Add Soft Skill">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="row d-flex justify-content-center">
                    <div class="col-md-8 mt-2">
                        <label for="" class="form-lable core-skills-lable ps-2 required-form-field">Core Skills &
                            Experience (add max
                            10)</label>
                    </div>
                </div>
                <div class="row d-flex justify-content-center">
                    <div class="col-12 col-md-8 d-flex flex-column flex-md-row align-items-center">
                        <input type="text" class="core-skills-input form-control mb-2 mb-md-0" placeholder="Skill"
                            maxlength="15" [(ngModel)]="coreSkill" name="coreSkill" id="coreSkill">
                        <input type="text" class="core-skills-input ms-0 ms-md-2 form-control mb-2 mb-md-0"
                            placeholder="No. of years" [(ngModel)]="skillYears" name="skillYears" id="skillYears"
                            #coreSkillyears="ngModel" pattern="^[1-9]\d?$"
                            [title]="coreSkillyears.errors?.['pattern'] ? ' Core skill Years is invalid' : ''"
                            [title]="coreSkillyears.errors?.['required'] ? ' Core skill Years is required' : ''"
                            [ngClass]="{ 'is-invalid': coreSkillyears.invalid && (coreSkillyears.dirty || coreSkillyears.touched) }">
                        <button class="btn btn-add ms-0 ms-md-auto mt-2 mt-md-0" type="button"
                            [disabled]="!isCoreSkillsValidForm() || coreSkillyears.invalid"
                            (click)="addCoreSkills()">Add</button>
                    </div>
                </div>


                <div class="d-flex justify-content-center mt-4 p-0 mb-3 ">
                    <div class="col-md-8">
                        <div class="float-left achievments-list d-flex"
                            *ngFor="let coreSkill of candidateProfessionalDetails.coreSkillList">
                            <div class="ps-3 m-1 text-in-box">{{coreSkill.skillName}} - {{coreSkill.years}}
                                {{coreSkill.years > 1 ? 'years': 'year'}}
                                <span class="text-in-box-close-icon" (click)="removeCoreSkills(coreSkill.skillName)">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M8 0.125C3.6125 0.125 0.125 3.6125 0.125 8C0.125 12.3875 3.6125 15.875 8 15.875C12.3875 15.875 15.875 12.3875 15.875 8C15.875 3.6125 12.3875 0.125 8 0.125ZM11.0375 11.9375L8 8.9L4.9625 11.9375L4.0625 11.0375L7.1 8L4.0625 4.9625L4.9625 4.0625L8 7.1L11.0375 4.0625L11.9375 4.9625L8.9 8L11.9375 11.0375L11.0375 11.9375Z"
                                            fill="#0A1E35" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!------Certificates Section-->

                <div class="row d-flex justify-content-center">
                    <div class=" col-12 col-md-8 mt-2">
                        <label for="" class="form-lable core-skills-lable ps-2">Certificate Names</label>
                    </div>
                </div>
                <div class="row d-flex justify-content-center">
                    <div class="col-12 col-md-8 d-flex flex-column flex-md-row align-items-center">
                        <input type="text" class="core-skills-input form-control mb-2 mb-md-0"
                            placeholder="Certificate Name" [(ngModel)]="newCertName" name="newCertName"
                            id="newCertName">
                        <input type="text"
                            class="core-skills-input  form-control  ms-0 ms-md-2 form-control mb-2 mb-md-0"
                            pattern="^([ \u00c0-\u01ffa-zA-Z'.])+$" placeholder="Issuing institute/company"
                            [(ngModel)]="certificateCompany" #certificateCompany1="ngModel" name="certificateCompany1"
                            id="certificateCompany1"
                            [title]="certificateCompany1.errors?.['pattern'] ? 'Institute Name is invalid' : ''"
                            [ngClass]="{ 'is-invalid': certificateCompany1.invalid && (certificateCompany1.dirty || certificateCompany1.touched) }">
                        <input type="text"
                            class="core-skills-input form-control  ms-0 ms-md-2 form-control mb-2 mb-md-0"
                            placeholder="Completion Date(MM-YYYY)" [(ngModel)]="certificateYear" name="completionyear"
                            id="completionyear" #completionyear="ngModel"
                            [title]="completionyear.errors?.['pattern'] ? 'Certification year is invalid' : ''"
                            [ngClass]="{ 'is-invalid': completionyear.invalid && (completionyear.dirty || completionyear.touched) }"
                            (focus)="setFutureMonthRestriction(completionyear)"
                            [title]="completionyear.errors?.['futureMonth'] ? 'Completion year is invalid' : ''">


                        <button class="btn btn-add ms-0 ms-md-auto mt-2 mt-md-0" type="button"
                            [disabled]="certificateCompany1.invalid|| !isValidCertificateForm() || completionyear.invalid"
                            (click)="addCertificate()">Add</button>
                        <!-- <div class="certificate-error-message" *ngIf="maxCertificate">
                                            You can not add more than 5 certificates.
                                        </div> -->
                    </div>


                </div>
                <div class="d-flex justify-content-center mt-4 p-0 mb-3">
                    <div class="col-md-8">
                        <div class="float-left achievments-list d-flex"
                            *ngFor="let certificates of candidateProfessionalDetails.certificationNames">

                            <div class="ps-3 m-1 text-in-box">{{certificates.certName}} -
                                {{certificates.issuedInstitution}}
                                <span class="text-in-box-close-icon" (click)="removeCertifiates(certificates.certName)">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M8 0.125C3.6125 0.125 0.125 3.6125 0.125 8C0.125 12.3875 3.6125 15.875 8 15.875C12.3875 15.875 15.875 12.3875 15.875 8C15.875 3.6125 12.3875 0.125 8 0.125ZM11.0375 11.9375L8 8.9L4.9625 11.9375L4.0625 11.0375L7.1 8L4.0625 4.9625L4.9625 4.0625L8 7.1L11.0375 4.0625L11.9375 4.9625L8.9 8L11.9375 11.0375L11.0375 11.9375Z"
                                            fill="#0A1E35" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row d-flex justify-content-center">
                    <div class="col-12 col-md-8 mt-2">
                        <label for="" class="form-lable core-skills-lable ps-2">Achievements</label>
                    </div>
                </div>
                <div class="row d-flex justify-content-center">
                    <div class="col-12 col-md-8 d-flex flex-column flex-md-row align-items-center">
                        <input type="text" class="core-skills-input form-control mb-2 mb-md-0" placeholder="Title"
                            [(ngModel)]="title" name="title" id="title">
                        <input type="text" class="core-skills-input  form-control ms-0 ms-md-2 mb-2 mb-md-0"
                            pattern="^([ \u00c0-\u01ffa-zA-Z'.])+$" placeholder="Where did you acquire this"
                            [(ngModel)]="instituteName" name="instituteName" id="instituteName"
                            #instituteName1="ngModel"
                            [title]="instituteName1.errors?.['pattern'] ? 'Institute Name is invalid' : ''"
                            [ngClass]="{ 'is-invalid': instituteName1.invalid && (instituteName1.dirty || instituteName1.touched) }">
                        <input type="text" class="core-skills-input  form-control ms-0 ms-md-2 mb-2 mb-md-0"
                            placeholder="Year of achievement(MM-YYYY)" [(ngModel)]="achievementmonth"
                            name="achievementdate" id="achievementdate" #achievementdate="ngModel"
                            [title]="achievementdate.errors?.['pattern'] ? 'Achievement date is invalid' : ''"
                            [ngClass]="{ 'is-invalid': achievementdate.invalid && (achievementdate.dirty || achievementdate.touched) }"
                            (focus)="setFutureMonth(achievementdate)"
                            [title]="achievementdate.errors?.['futureMonths'] ? 'Achievement date is invalid' : ''">


                        <button class=" btn btn-add ms-0 ms-md-auto mt-2 mt-md-0" type="button"
                            [disabled]="instituteName1.invalid ||!isValidForm() || achievementdate.invalid"
                            (click)="addAchievement()">Add</button>
                    </div>

                </div>
                <div class="d-flex justify-content-center mt-4 p-0 mb-3">
                    <div class="col-8">
                        <div class="float-left achievments-list d-flex"
                            *ngFor="let achievement of candidateProfessionalDetails.achievements">
                            <div class="m-1 text-in-box">{{achievement.title}}
                                <span class="text-in-box-close-icon" (click)="removeAchievement(achievement.title)">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M8 0.125C3.6125 0.125 0.125 3.6125 0.125 8C0.125 12.3875 3.6125 15.875 8 15.875C12.3875 15.875 15.875 12.3875 15.875 8C15.875 3.6125 12.3875 0.125 8 0.125ZM11.0375 11.9375L8 8.9L4.9625 11.9375L4.0625 11.0375L7.1 8L4.0625 4.9625L4.9625 4.0625L8 7.1L11.0375 4.0625L11.9375 4.9625L8.9 8L11.9375 11.0375L11.0375 11.9375Z"
                                            fill="#0A1E35" />
                                    </svg>

                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <!-- [disabled]="(!isCandidateFresher && !candidateProfessionalDetails.companyName  ||!candidateProfessionalDetails.department || !candidateProfessionalDetails.designation || !candidateProfessionalDetails.ctc ||!candidateProfessionalDetails.ectc ||!candidateProfessionalDetails.noticePeriod)" -->
                    <div class="col-md-10 d-flex justify-content-end">
                        <button class="btn btn-next me-2" (click)="goBack()">Previous</button>
                        <button class="btn btn-next" type="submit" [disabled]="
                                        (!candidateProfessionalDetails.isCandidateFresher && (
                                         
                                          !candidateProfessionalDetails?.companyName ||
                                          !candidateProfessionalDetails.department ||
                                          !candidateProfessionalDetails.designation ||
                                          !candidateProfessionalDetails.ctc ||
                                          !candidateProfessionalDetails.ectc ||

                                          candidateProfessionalDetails?.softSkills?.length<=0 ||
                                          candidateProfessionalDetails?.coreSkillList?.length<=0||
                                          candidateProfessionalDetails?.noticePeriod?.toString() === '' ||
                                          candidateProfessionalDetails?.noticePeriod?.toString() ===null ||
                                          !candidate.form.valid ||
                                          (!candidateProfessionalDetails.fileName &&!fileName)
                                        )) || 
                                        (candidateProfessionalDetails.isCandidateFresher &&(  candidateProfessionalDetails?.softSkills?.length<=0 ||
                                          candidateProfessionalDetails?.coreSkillList?.length<=0 || (!candidateProfessionalDetails.fileName && !fileName)))">Complete</button>
                                          <!-- <button class="btn btn-next" type="submit"></button> -->
                    </div>

                </div>
            </form>

        </div>
    </div>
</div>


<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
    [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
    [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'md'">
    <ng-container *ngIf="showModal === modalType.SUCCESS_MESSAGE">
        <div class="row message-card px-sm-3 p-4">
            <div class="font-weight-bold text-color-red mb-3 d-flex justify-content-center"
                style="color: #e40707; font-size: medium;" *ngIf="successtitle === 'Error'">
                {{successtitle}}
            </div>


            <div class="d-flex justify-content-center"><span>{{successmessage}}</span> </div>

            <div class=" mt-3 d-flex justify-content-center">
                <button class="btn btn-next" (click)="cancel()" *ngIf="successtitle === 'Error'"> Close</button>

            </div>
        </div>
    </ng-container>

</app-modal>
