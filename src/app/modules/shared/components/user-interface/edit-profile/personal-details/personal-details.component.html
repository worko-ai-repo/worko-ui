                    <div class="row d-flex mt-2">
                        <div class="col-md-3 ms-3 ">
                            <label class="form-check-label float-end">
                                <input type="checkbox" (click)="userFresher()"> Fresher

                    </div>
                    
                    <div class="row d-flex justify-content-center mt-2" *ngIf="!isFresher">
                        <div class="col-md-3">
                            <label for="" class="form-label">Company Name</label>
                            <input type="text" class="form-control form-input" placeholder="Company Name"
                                [(ngModel)]="candidateProfessionalDetails.companyName" name="companyName" id="companyName">
                        </div>
                        <div class="col-md-3">
                            <label for="" class="form-label">Designation</label>
                            <input type="text" class="form-control form-input" placeholder="Designation"
                                [(ngModel)]="candidateProfessionalDetails.designation" name="designation" id="designation">
                        </div>
                        <div class="col-md-2">
                            <label for="" class="form-label">Department</label>
                            <input type="text" class="form-control form-input" placeholder="Department"
                                [(ngModel)]="candidateProfessionalDetails.department" name="department" id="department">
                        </div>
                    </div>
                    
                    <div class="row d-flex justify-content-center mt-2" *ngIf="!isFresher">
                        <div class="col-md-3">
                            <label for="" class="form-label">CTC</label>
                            <input type="text" class="form-control form-ctc" placeholder="CTC" [(ngModel)]="candidateProfessionalDetails.ctc"
                                name="ctc" id="ctc">
                        </div>
                        <div class="col-md-3">
                            <label for="" class="form-label">ECTC</label>
                            <input type="text" class="form-control form-ctc" placeholder="ECTC"
                                [(ngModel)]="candidateProfessionalDetails.ectc" name="ectc" id="ectc">
                        </div>
                        <div class="col-md-2">
                            <label for="" class="form-label">Notice period</label>
                            <input type="text" class="form-control form-ctc" placeholder="Notice period"
                                [(ngModel)]="candidateProfessionalDetails.noticePeriod" name="noticePeriod" id="noticePeriod">
                        </div>
                    </div>

                                <div class="skill-container">
                                    <div *ngFor="let softSkill of candidateProfessionalDetails.softSkills">
                                        <div class=" m-1 text-in-box">{{softSkill.skillName}}

                                            placeholder="Enter Soft Skils" (blur)="addSoftSkill()">
                                    </div>

                    <div class="row d-flex justify-content-center">
                        <div class="col-md-8 mt-2">
                            <label for="" class="form-lable core-skills-lable ps-2">Core Skills & Experience (add max
                                15)</label>
                        </div>
                    </div>
                    <div class="row d-flex justify-content-center">
                        <div class="col-8 ms-5">
                            <input type="text" class="core-skills-input" placeholder="Skill" [(ngModel)]="coreSkill"
                                name="coreSkill" id="coreSkill">
                            <input type="text" class="core-skills-input ms-2" placeholder="No. of years"
                                [(ngModel)]="skillYears" name="skillYears" id="skillYears">
                     
                            <button class="float-end btn btn-add" type="button" [disabled]="!isCoreSkillsValidForm()"
                                (click)="addCoreSkills()">Add</button>
                        </div>

                    </div>
                
                    <div class="d-flex justify-content-center mt-4 p-0 mb-3">
                        <div class="float-left achievments-list d-flex"
                            *ngFor="let coreSkill of candidateProfessionalDetails.coreSkillList">
                            <div class="ps-3 m-1 text-in-box">{{coreSkill.skillName}} - {{coreSkill.years}} {{coreSkill.years > 1 ? 'years': 'year'}}
                                <span class="text-in-box-close-icon" (click)="removeCoreSkills(coreSkill.skillName)">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M8 0.125C3.6125 0.125 0.125 3.6125 0.125 8C0.125 12.3875 3.6125 15.875 8 15.875C12.3875 15.875 15.875 12.3875 15.875 8C15.875 3.6125 12.3875 0.125 8 0.125ZM11.0375 11.9375L8 8.9L4.9625 11.9375L4.0625 11.0375L7.1 8L4.0625 4.9625L4.9625 4.0625L8 7.1L11.0375 4.0625L11.9375 4.9625L8.9 8L11.9375 11.0375L11.0375 11.9375Z"
                                            fill="#0A1E35" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </div>

                    <!------Certificates Section-->

                    <div class="row d-flex justify-content-center">
                        <div class="col-md-8 mt-2">
                            <label for="" class="form-lable core-skills-lable ps-2">Certificate Names</label>
                        </div>
                    </div>
                    <div class="row d-flex justify-content-center">
                        <div class="col-8 ms-5">
                            <input type="text" class="core-skills-input" placeholder="Certificate Name" [(ngModel)]="newCertName"
                                name="newCertName" id="newCertName">
                                <input type="text" class="core-skills-input ms-2" placeholder="Issuing institute/company" [(ngModel)]="certificateCompany"
                                name="certificateCompany" id="certificateCompany">
                                <input type="text" class="core-skills-input ms-2" placeholder="year of certification" [(ngModel)]="certificateYear"
                                name="certificateYear" id="certificateYear">
                          
                            <button class="float-end btn btn-add" type="button" [disabled]="!isValidForm()"
                                (click)="addAchievement()">Add</button>
                        </div>

                    </div>
                    <div class="d-flex justify-content-center mt-4 p-0 mb-3">
                        <div class="float-left achievments-list d-flex"
                            *ngFor="let certificates of candidateProfessionalDetails.certificationNames">
                           
                                <div class=" m-1 text-in-box">{{certificates.certName}}
                                    <span class="text-in-box-close-icon"
                                        (click)="removeCertifiates(certificates.certName)">
                                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                            xmlns="http://www.w3.org/2000/svg">
                                            <path
                                                d="M8 0.125C3.6125 0.125 0.125 3.6125 0.125 8C0.125 12.3875 3.6125 15.875 8 15.875C12.3875 15.875 15.875 12.3875 15.875 8C15.875 3.6125 12.3875 0.125 8 0.125ZM11.0375 11.9375L8 8.9L4.9625 11.9375L4.0625 11.0375L7.1 8L4.0625 4.9625L4.9625 4.0625L8 7.1L11.0375 4.0625L11.9375 4.9625L8.9 8L11.9375 11.0375L11.0375 11.9375Z"
                                                fill="#0A1E35" />
                                        </svg>
                                    </span>
                                </div>
                            </div>
                        </div>
                    




                    
                 

                    <div class="row d-flex justify-content-center">
                        <div class="col-md-8 mt-2">
                            <label for="" class="form-lable core-skills-lable ps-2">Achievements</label>
                        </div>
                    </div>
                    <div class="row d-flex justify-content-center">
                        <div class="col-8 ms-5">
                            <input type="text" class="core-skills-input" placeholder="Title" [(ngModel)]="title"
                                name="title" id="title">
                                <input type="text" class="core-skills-input ms-2" placeholder="Where did you acquire this" [(ngModel)]="date"
                                name="date" id="date">
                                <input type="text" class="core-skills-input ms-2" placeholder="Year of achievement" [(ngModel)]="date"
                                name="date" id="date">
                          
                            <button class="float-end btn btn-add" type="button" [disabled]="!isValidForm()"
                                (click)="addAchievement()">Add</button>
                        </div>

                    </div>
                    <div class="d-flex justify-content-center mt-4 p-0 mb-3">
                        <div class="float-left achievments-list d-flex"
                            *ngFor="let achievement of candidateProfessionalDetails.achievements">
                            <div class="ps-3 ms-1 text-in-box">{{achievement.title}}
                                <span class="text-in-box-close-icon" (click)="removeAchievement(achievement.title)">
                                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M8 0.125C3.6125 0.125 0.125 3.6125 0.125 8C0.125 12.3875 3.6125 15.875 8 15.875C12.3875 15.875 15.875 12.3875 15.875 8C15.875 3.6125 12.3875 0.125 8 0.125ZM11.0375 11.9375L8 8.9L4.9625 11.9375L4.0625 11.0375L7.1 8L4.0625 4.9625L4.9625 4.0625L8 7.1L11.0375 4.0625L11.9375 4.9625L8.9 8L11.9375 11.0375L11.0375 11.9375Z"
                                            fill="#0A1E35" />
                                    </svg>

                                </span>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-10 d-flex justify-content-end">
                            <!-- (click)="previousStep.emit()" -->
                            <button class="btn btn-next me-2" (click)="goBack()">Previous</button>
                            <button class="btn btn-next" type="submit"    [disabled]="!candidateProfessionalDetails.companyName  ||!candidateProfessionalDetails.department || !candidateProfessionalDetails.desigination || !candidateProfessionalDetails.ctc ||!candidateProfessionalDetails.ectc ||!candidateProfessionalDetails.noticePeriod" >Next</button>
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>
