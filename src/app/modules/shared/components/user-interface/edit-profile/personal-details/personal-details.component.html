<div class="card candidate-card">
    <div class="card-body">
        <div class="row">
            <div class="col-md-12">
                <div class="row mt-2">
                    <div class="col-md-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 52 52" fill="none"
                            routerLink="/candidate/cdashboard">

                                fill="#F8F8F8" />
                        </svg>

                    </div>
                    <div class="col-md-8">
                        <h6 class="edit-profile-text">Edit Profile</h6>
                    </div>
                </div>
            </div>

        </div>
        <div class="row mt-5 row d-flex justify-content-center">

            <div class="col-md-12">
                <form (ngSubmit)="candidate.form.valid && createProfessionalDetails(form)" #candidate="ngForm"
                    novalidate>
                    <div class="row d-flex justify-content-center">
                        <div class="col-md-4">
                            <label for="" class="form-lable">Company Name</label>
                            <input type="text" class="form-control form-input" placeholder="Company Name"
                                #companyName="ngModel" [(ngModel)]="candidateProfessionalDetails.companyName"
                                name="companyName" id="companyName">
                        </div>
                        <div class="col-md-4">
                            <label for="" class="form-lable"> Officinal Email</label>
                            <input type="text" class="form-control form-input" placeholder="123@gmail.com"
                                #officialEmail="ngModel" [(ngModel)]="candidateProfessionalDetails.officialEmail"
                                name="officialEmail" id="officialEmail">

                        </div>

                    </div>

                    <div class="row d-flex justify-content-center mt-2">
                        <div class="col-md-4">
                            <label for="" class="form-lable">Desigination</label>
                            <input type="text" class="form-control form-input" placeholder="Desigination"
                                #desigination="ngModel" [(ngModel)]="candidateProfessionalDetails.desigination"
                                name="desigination" id="desigination">
                        </div>
                        <div class="col-md-4">
                            <label for="" class="form-lable">Department</label>
                            <input type="text" class="form-control form-input" placeholder="Department"
                                #department="ngModel" [(ngModel)]="candidateProfessionalDetails.department"
                                name="department" id="department">

                        </div>

                    </div>

                    <div class="row d-flex justify-content-center mt-2">
                        <div class="col-md-3">
                            <label for="" class="form-lable">CTC</label>
                            <input type="text" class="form-control form-ctc" placeholder="CTC" #ctc="ngModel"
                                [(ngModel)]="candidateProfessionalDetails.ctc" name="ctc" id="ctc">
                        </div>
                        <div class="col-md-3">
                            <label for="" class="form-lable">ECTC</label>
                            <input type="text" class="form-control form-ctc" placeholder="ECTC" #ectc="ngModel"
                                [(ngModel)]="candidateProfessionalDetails.ectc" name="ectc" id="ectc">

                        </div>
                        <div class="col-md-2">
                            <label for="" class="form-lable">Notice period</label>
                            <input type="text" class="form-control form-ctc" placeholder="Notice period"
                                #noticePeriod="ngModel" [(ngModel)]="candidateProfessionalDetails.noticePeriod"
                                name="noticePeriod" id="noticePeriod">

                        </div>

                    </div>
                    <div class="row d-flex justify-content-center mt-2">
                        <div class="col-md-4">
                            <label for="" class="form-lable">Certificate Names</label>
                            <div class="certific-skill-box">
                                <div *ngFor="let certificates of candidateProfessionalDetails.certificationNames">

                                    <div class=" m-2 p-1 skills-add skills-text">{{certificates.certName}}
                                    <span><i class="fa-solid fa-xmark"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="" class="form-lable">Soft skills</label>
                            <div class="certific-skill-box">
                                <div *ngFor="let certificates of candidateProfessionalDetails.certificationNames">

                                    <div class=" m-2 p-1 skills-add skills-text">{{certificates.certName}}
                                    <span><i class="fa-solid fa-xmark"></i></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- <div class="row d-flex justify-content-center mt-2">
                        <div class="col-md-4">
                            <label for="" class="form-lable">Certificate Names</label>
                            <div class="d-flex ">

                            <textarea name="" id="" class="textarea-soft-skills" cols="34" rows="3"
                                #softSkills="ngModel" [(ngModel)]="candidateProfessionalDetails.softSkills"
                                name="softSkills" id="softSkills"></textarea>
                        </div>

                    <div class="row">
                        <div class="col-md-6 mt-2">
                            <label for="" class="core-skills-lable float-end">Core Skills & Experience (add max
                                15)</label>
                        </div>
                    </div>
                    <div class="row d-flex justify-content-center">
                        <div class="col-8 ms-5">
                            <input type="text" class="core-skills-input" placeholder="Skills" #skill="ngModel"
                                [(ngModel)]="candidateProfessionalDetails.skill" name="skill" id="skill">
                            <input type="text" class="core-skills-input ms-2" placeholder="No.of years" #name="ngModel"
                                [(ngModel)]="candidateProfessionalDetails.year" name="year" id="year">
                            <button class="float-end btn btn-add">Add</button>
                        </div>

                    </div>
                    <div class="row d-flex justify-content-center mt-4 p-0 ">

                        <div class="col-md-3 ps-3 ms-2 skills-add skills-text">React.js <span><i class="fa-solid fa-xmark"></i></span></div>
                        <div class="col-md-3 ps-3 ms-2 skills-add skills-text">React.js<span><i class="fa-solid fa-xmark"></i></span></div>
                        <div class="col-md-3 ps-3 ms-2 skills-add skills-text">React.js<span><i class="fa-solid fa-xmark"></i></span></div>
                        <div class="col-md-3 ps-3 ms-2 skills-add skills-text">React.js<span><i class="fa-solid fa-xmark"></i></span></div>


                    </div>

                    <div class="row d-flex justify-content-center">
                        <div class="col-md-8 mt-2">
                            <label for="" class="form-lable core-skills-lable ps-2">Achievements</label>
                        </div>
                    </div>
                    <div class="row d-flex justify-content-center">
                        <div class="col-8 ms-5">
                            <input type="text" class="core-skills-input" placeholder="Title" #name="ngModel"
                                [(ngModel)]="candidateProfessionalDetails.title" name="title" id="title">
                            <input type="date" class="core-skills-input ms-2" placeholder="Date" #name="ngModel"
                                [(ngModel)]="candidateProfessionalDetails.date" name="date" id="date">
                            <button class="float-end btn btn-add">Add</button>
                        </div>

                    </div>
                    <div class="row d-flex justify-content-center mt-4 p-0 ">

                        <div class="col-md-3 ps-3 ms-2 Achiv-skills-add skills-text">Microsoft Hack3.0</div>
                    </div>
                    <div class="row">
                        <div class="col-md-10 d-flex justify-content-end">
                            <button class="btn btn-next me-2" (click)="previousStep.emit()">Previous</button>
                            <button class="btn btn-next" type="submit">Next</button>
                        </div>

                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
