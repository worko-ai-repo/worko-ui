<div class="card candidate-card">

    <div class="card-body d-flex flex-column">

        <div class="container-fluid" style="height: 100%;">

            <div class="row" style="height: 100%;">

                <div *ngIf="selectedReferral" class="col-md-12" style="height: fit-content;">
                    <app-new-request-btn></app-new-request-btn>
                </div>

                <div *ngIf="selectedReferral" class="col-md-12"
                    style="margin-top:15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">

                    <div class="col-md-12"
                        style="color: white; display: flex; flex-direction: row; justify-content: end;">
                        <div style="width: fit-content; text-align: left;">
                            <span class="text-white">Job Url : <a href="{{selectedReferral?.jobUrl}}"
                                    target="_blank">Link</a></span> <br>
                            <span class="text-white">Company Name : {{selectedReferral?.companyName}}</span> <br>
                            <span class="text-white">Matching Score : {{selectedReferral?.matchingScore}}</span>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <div *ngIf="selectedReferral" class="col-md-12  d-flex justify-content-center">
                            <img src="/assets/public/candidate-referral-img.png" class="referral-img" alt="">

                        </div>
                        <div *ngIf="selectedReferral" class="col-md-12 text-center pb-5">
                            <span class="text-white">Oops! Looks like you've withdrawn your referral request.</span> <br>
                            <span class="text-white">No problem! We're here whenever you need us.</span> <br>
                            <span class="text-white">Your success matters to us!</span>
                        </div>
                    </div>

                </div>


                <div *ngIf="!selectedReferral" class="center-elements">

                    <div>
                        <app-new-request-btn></app-new-request-btn>
                    </div>

                    <div style="margin-top: 5px;">
                        <span class="text-white">Get referral now!</span> <br>
                    </div>

                </div>

            </div>

        </div>
    </div>
</div>
