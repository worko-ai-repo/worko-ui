<div class="row message-card px-sm-3 p-4">
    <div class="message-title-error" *ngIf="title === 'Error'">
        {{ title }}
    </div>
    <div class="message-title-error" *ngIf="title === 'Alert'">
        {{ title }}
    </div>

    <div class="message-title-warning" *ngIf="title === 'Warning!'">
        {{ title }}
    </div>

    <div class="message-title-success" *ngIf="title === 'Congratulations!'">
        {{ title }}
    </div>

    <div class="d-flex justify-content-center message-text">
        <span>{{ message }}</span>
    </div>
    <div class=" mt-3 d-flex justify-content-center">
        <button class="btn btn-next" (click)="cancelBtn()" *ngIf="title === 'Error'">Cancel</button>
        <button class="btn btn-next" (click)="okBtn()" *ngIf="title === '' || title === 'Alert'">Ok</button>
        <button class="btn btn-next err" (click)="noBtn()" *ngIf="title === '' || title === 'Warning!'">No</button>
        <button class="btn btn-next" (click)="yesBtn()" *ngIf="title === '' || title === 'Warning!'">Yes</button>
        <button class="btn btn-next" (click)="continueBtn()" *ngIf="title === 'Congratulations!' || title === 'Success!'">Continue</button>
    </div>
</div>
