<div *ngIf="true" class="modal-body candidate-card" style="border-radius: 6px;">
    <div class="row">
        <div class="col-md-12">
            <h4 style="color: #4ECB71;" class="order-heading">Payment Complete</h4>
        </div>
    </div>

    <div class="mt-3">

        <div class="row p-3">
            <div class="col-md-12">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h6 style="font-size: 18px;">Let's get started!</h6>

                        <div class="row pl-4 pt-3">
                            <div class="col-md-12">
                                <div class="d-flex flex-column">
                                    <h6 style="text-decoration:solid; color: #2F92C7;"><b>Your payment was successful!</b></h6>
                                    <h6>Here's your order summary:</h6>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="check-icon-div">
                        <img src="/assets/icons/greenCheckMark.png" alt="">
                    </div>

                </div>
            </div>
        </div>

        <div class="row pl-3">
            <div class="col-md-12">
                <div class="row pl-5">
                    <div class="col-md-12 pl-5">
                        <div>
                            <h6>1. Request Transcript</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row p-3">
            <div class="col-md-12 mt-2 mb-2">
                <div class="btn-pay btn text-white float-end p-2 ps-4 pe-4 ms-2" (click)="nextBtn()">NEXT</div>
                <div (click)="closeModal()" class=" btn-pay btn text-white float-end p-2 ps-3 pe-3">CLOSE</div>
            </div>
        </div>

    </div>
</div>

<div *ngIf="false" class="modal-body candidate-card" style="border-radius: 6px;">

    <div class="row">
        <div class="col-md-12 d-flex justify-content-between">

            <div>
                <h4 style="color: #E51818;" class="order-heading">Payment Declined</h4>

                <div class="p-3">
                    <h6 style="font-size: 18px; color: #2F92C7;"><b>Oh Snap!</b></h6>
                    <h6>The payment card was declined</h6>
                </div>
            </div>

            <div class="check-icon-div pr-2">
                <img src="/assets/icons/warningSignRed.png" alt="">
            </div>
        </div>
    </div>

    <div class="">

        <div class="row pl-5">
            <div class="col-md-12">
                <div class="row pl-4 pt-3">
                    <div class="col-md-12">
                        <div class="d-flex flex-column">
                            <h6 style="text-decoration:solid; color: #2F92C7;"><b>Either:</b></h6>
                            <h6 class="pl-2">Retry with a different payment card</h6>
                        </div>

                        <div class="d-flex flex-column">
                            <h6 style="text-decoration:solid; color: #2F92C7;"><b>Or:</b></h6>
                            <h6 class="pl-2">Contact your card provider</h6>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row p-3">
            <div class="col-md-12 mt-2 mb-2">
                <div class="btn-pay btn text-white float-end p-2 ps-4 pe-4 ms-2" (click)="nextBtn()">RETRY DIFFERENT
                    CARD</div>
                <div (click)="closeModal()" class=" btn-pay btn text-white float-end p-2 ps-3 pe-3">CLOSE</div>
            </div>
        </div>

    </div>
</div>
