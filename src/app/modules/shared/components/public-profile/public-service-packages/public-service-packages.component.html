<div class="row" style="height: 100%;">
  <div class="col-md-12 ps-5 pt-3">
    <h5 class="ps-5 pt-1">Service Packages</h5>
  </div>
  <div class="col-md-12">
    <div class="row d-flex justify-content-center">
      <div class="col-md-5 ms-4 mt-3" *ngFor="let package of publicServiceList;  let i = index;">

        <div class="package-card">
          <div class="d-flex p-3 ps-0  justify-content-between">
            <h6 class="card-text fw-bold ps-3">{{i+1}} {{package.serviceName}}</h6>
            <div class="rating-card text-center ps-3 pe-3">
              <div class="pt-1 pb-0 mb-0">4.2/5</div>
              <div class="pb-1 pt-0 mt-0 rating-text">178 RATING</div>
            </div>
          </div>

          <div>
            <ul class="ms-3 referral-text">
              <li *ngFor="let points of package.serviceScope">{{ points }}</li>
            </ul>
          </div>
          <div class="card-footer">
            <div class="d-flex p-2  justify-content-between">
                <div class="ps-2">{{package.durationAndPrices[0].durationInMinutes}}</div>
                <div class="float-end pe-2">{{package.durationAndPrices[0].rate}}<b>/-</b>  </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
