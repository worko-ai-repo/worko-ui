    <!-- Chat Messages -->
    <div class="chat-messages">
        <div *ngFor="let msg of messages"
            [ngClass]="{'right': msg.senderId === userId, 'left': msg.senderId !== userId}" class="message">
            <div class="message-content">
                <p>{{ msg.text }}</p>
            </div>
        </div>
    </div>

    <!-- Message Input -->
    <div class="message-input">
        <button class="attach-btn">
            <img src="assets/chat-ui-images/attachment_icon.png" alt="Attach">
        </button>

        <button class="gallery-btn">
            <img src="assets/chat-ui-images/gallery_icon.png" alt="Gallery">
        </button>
        <input [(ngModel)]="newMessage" type="text" placeholder="Write message here">
        <button (click)="sendMessage()" class="send-btn">
            <img src="assets/chat-ui-images/send_icon.png" alt="Send">
        </button>
    </div>
</div>
