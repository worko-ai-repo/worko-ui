<div class="candidate-card payment-modal" style="border-radius: 6px;">
    <div class="row">
        <div class="card-content">
            <div class="popup-card">

                <div class="mb-3">
                    <h3 class="modal-title">Payment Done Details</h3>
                </div>

                <form [formGroup]="paymentForm" (ngSubmit)="onSubmit()" novalidate>
                    <div class="mb-3">
                        <label class="form-label required-form-field">Action Date</label>
                        <input type="datetime-local" class="form-control" formControlName="actionDate"
                            [ngClass]="{ 'is-invalid': isInvalid('actionDate') }" />
                        <div *ngIf="isInvalid('actionDate')" class="invalid-feedback">
                            {{ getErrorMessage('actionDate') }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required-form-field">Amount Paid</label>
                        <input type="number" class="form-control" formControlName="amountPaid" min="1"
                            placeholder="Enter amount" [ngClass]="{ 'is-invalid': isInvalid('amountPaid') }" />
                        <div *ngIf="isInvalid('amountPaid')" class="invalid-feedback">
                            {{ getErrorMessage('amountPaid') }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label required-form-field">Unique Transaction Reference</label>
                        <input type="text" class="form-control" formControlName="uniqueTransactionReference"
                            placeholder="e.g. N1234567***23456"
                            [ngClass]="{ 'is-invalid': isInvalid('uniqueTransactionReference') }" />
                        <div *ngIf="isInvalid('uniqueTransactionReference')" class="invalid-feedback">
                            {{ getErrorMessage('uniqueTransactionReference') }}
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="ps-4 pe-4 btn searchButton" [disabled]="paymentForm.invalid">
                            Submit
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
