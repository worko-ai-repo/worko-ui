<div class="paste-jd-main">
  <div class="paste-jd-head">
    <label for="job-description" class="form-label required-form-field">Job Description</label>
    <span class="ajob-tooltip" style="cursor: pointer; width: min-content; position:relative; height: min-content;">
      <i class="fa-solid fa-circle-info" matTooltip="{{jdValidFormatInfo}}" matTooltipClass="compact-tooltip"
        matTooltipPosition="above"></i>
    </span>
  </div>
  <div class="paste-jd-content one">
    <textarea minlength="100" id="job-description" class="job-description bg-transparent text-white form-control"
    [formControl]="jdControl"
    [ngClass]="{ 'is-invalid': jdControl.invalid && (jdControl.dirty || jdControl.touched) }"
      rows="10"
      placeholder="Paste your Job Description here"></textarea>
    <div *ngIf="jdControl.invalid && (jdControl.dirty || jdControl.touched)" class="text-danger">
      {{ getErrorMessage() }}
    </div>
  </div>
</div>
