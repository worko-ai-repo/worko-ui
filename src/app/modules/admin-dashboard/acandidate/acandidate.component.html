<div class="acandidate-contents">
    <div class="header-container">
        <div class="title">Candidate Info</div>
    </div>
    <div class="filter-container">
        <div class="date-range filter">
            <select class="selector form-select" name="dateRange" id="dateRange"
                [(ngModel)]="filterData.dateRange" (ngModelChange)="onJoiningDateChange($event)">
                <option value="">Date Range</option>
                <option *ngFor="let item of dateRangeOptions" [value]="item.value">{{ item.name }}</option>
            </select>
        </div>
        <div class="profile-status filter">
            <select class="selector form-select" name="profileStatus" id="profileStatus"
                [(ngModel)]="filterData.profileStatus" (ngModelChange)="onProfileStatusChange($event)">
                <option value="">Profile Status</option>
                <option *ngFor="let item of profileStatusOptions" [value]="item.value">{{ item.name }}</option>
            </select>
        </div>
        <div class="referral-count filter">
            <select class="selector form-select" name="referralCount" id="referralCount"
                [(ngModel)]="filterData.referralCount" (ngModelChange)="onReferralCountChange($event)">
                <option value="">Referral Request Status</option>
                <option *ngFor="let item of referralCountOptions" [value]="item.value">{{ item.name }}</option>
            </select>
        </div>
        <!-- <div class="filter1">
            <select class=" selector form-select" name="joiningDate" id="joiningDate"
                [(ngModel)]="filterData.joiningDate" (ngModelChange)="onJoiningDateChange($event)">
                <option value="">Select Joining Date</option>
                <option *ngFor="let item of joinDateOptions" [value]="item.value">{{ item.name }}</option>
            </select>
        </div> -->
        <div class="date-range filter">
            <select class="selector form-select" name="dateRange" id="dateRange"
                [(ngModel)]="filterData.joinDate" (ngModelChange)="onJoiningDateChange($event)">
                <option value="">Joining Date</option>
                <option *ngFor="let item of dateRangeOptions" [value]="item.value">{{ item.name }}</option>
            </select>
        </div>
    </div>
</div>
