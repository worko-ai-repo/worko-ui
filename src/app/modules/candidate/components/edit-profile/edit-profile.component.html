<div class="row content-container">
    <div class="col-md-12">
        <div class="candidate-card pb-4 mb-2">
            <div class="row">
                <div class="col-md-12">
                    <app-user-stepper [userType]="'Candidate'" [currentStep]="currentStep" (nextStep)="nextStep()"
                        (previousStep)="previousStep()"></app-user-stepper>
                </div>
            </div>
            <div class="divide-45">
                <div class="row" style="height:100%">

                    <app-personal-information [candidatePersonalDetails]="candidatePersonalDetails"
                        [candidateList]="candidateList" [educationList]="educationList"
                        [candidateSocial]="candidateSocial" *ngIf="currentStep === 1"
                        (onSuccess)="getCandidateListData($event)" (nextStepSecond)="nextStepSecond($event)">
                    </app-personal-information>

                    <app-personal-details [candidateProfessionalDetails]="candidateProfessionalDetails"
                        *ngIf="currentStep === 2" (nextStep)="nextStep()" (previousStep)="previousStepFirst($event)" 
                        [candidateList]="candidateList" [workExperienceDetails]="workExperienceDetails"
                        [certificationList]="certificationList" [achievementsList]="achievementsList"
                        (onSuccess)="getProfessionalData($event)"></app-personal-details>

                    <app-upload [candidateUploadDetails]="candidateUploadDetails" [candidateList]="candidateList"
                        *ngIf="currentStep === 3" (previousStep)="previousStepSecond($event)"
                        (onSuccess)="onSuccess($event)">
                    </app-upload>
                </div>
            </div>
        </div>
    </div>
</div>

<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
    [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
    [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'md'">

    <!-- <app-messagmodal  [message]="successmessage" [title]="successtitle"></app-messagmodal> -->
    <div class="row message-card px-sm-3 p-4">
        <div class="font-weight-bold text-color-red mb-3 d-flex justify-content-center" style="color: #e40707; font-size: medium;" *ngIf="successtitle === 'Error'">
            {{successtitle}}
        </div>
        <div class="font-weight-bold text-color-blue mb-3 d-flex justify-content-center" *ngIf="successtitle === 'Congratulations!'">
          {{successtitle}}
      </div>
  
        <div class="d-flex justify-content-center"><span>{{successmessage}}</span> </div>
  
        <div class=" mt-3 d-flex justify-content-center">
            <button class="btn btn-next" (click)="cancel()" *ngIf="successtitle === 'Error'"> Close</button>
            <button class="btn btn-next" (click)="continue()" *ngIf="successtitle === 'Congratulations!'">
                Continue</button>
        </div>
    </div>


</app-modal>
