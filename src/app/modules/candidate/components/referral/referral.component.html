<div class="row content-container">
    <div class="left-container-content referral-candidate-left-container">
        <!-- divide-45 -->
        <app-awaiting-status [userType]="userType" (statusSelected)="onStatusSelected($event)" [referralList]="referralList" (showReferralDetails)="showReferralDetails($event)"> </app-awaiting-status>
    </div>
    <div class="divide-55">
        <div class="row" style="height:100%">
            <app-referral-stepper [selectedReferral]="selectedReferral" [statusitem]="statusItem"></app-referral-stepper>
            <div class="status-container">
                <ng-container *ngIf="selectedStatus === 'AWAITING'; else otherStatus">
                    <app-new-request (markAsDone)="referralMarkAsDone($event)" (onWithdraw)="referralWithdraw($event)" [selectedReferral]="selectedReferral"></app-new-request>
                </ng-container>
                <ng-template #otherStatus>
                    <app-withdrawn-referral *ngIf="selectedStatus === 'WITHDRAWN'" [selectedReferral]="selectedReferral"></app-withdrawn-referral>
                    <app-referral-cancelled [userType]="userType" *ngIf="selectedStatus === 'CANCELLED'" [selectedReferral]="selectedReferral"></app-referral-cancelled>
                    <app-referral-req-rejected *ngIf="selectedStatus === 'REJECTED'" (markAsDone)="referralMarkAsDone($event)" [selectedReferral]="selectedReferral"></app-referral-req-rejected>
                    <app-accepted-referral [userType]="userType" *ngIf="selectedStatus === 'ACCEPTED'" [refereeDetails]="refereeDetails" (markAsDone)="referralMarkAsDone($event)" (raiseIssue)="referralRaiseIssue($event)" [selectedReferral]="selectedReferral"></app-accepted-referral>
                    <app-referral-req-done *ngIf="selectedStatus === 'DONE'" [userType]="userType" [processStatus]="processStatus" [refereeDetails]="refereeDetails" [reviewData]="reviewData" (referralRating)="createReview($event)" (markAsDone)="referralMarkAsDone($event)" (raiseIssue)="referralRaiseIssue($event)" [selectedReferral]="selectedReferral"></app-referral-req-done>
                </ng-template>
            </div>
        </div>
    </div>
</div>

<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
    [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
    [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'md'">

    <!-- <app-messagmodal  [message]="successmessage" [title]="successtitle"></app-messagmodal> -->
    <div *ngIf="!(showModal === modalType.REFERRAL_RATING)" class="row message-card px-sm-3 p-4"
        style="border-radius: 6px;">
        <div class="font-weight-bold text-color-red mb-3 d-flex justify-content-center"
            style="color: #e40707; font-size: 20px;" *ngIf="successtitle === 'Error'">
            {{successtitle}}
        </div>
        <div class="font-weight-bold text-color-blue mb-3 d-flex justify-content-center" style="font-size: 20px;"
            *ngIf="successtitle === 'Congratulations!'">
            {{successtitle}}
        </div>

        <div class="d-flex justify-content-center" style="text-align: center; font-size: 19px;">
            <span>{{successmessage}}</span>
        </div>

        <div class=" mt-3 d-flex justify-content-center">
            <button style="background: #2371CB; font-size: 15px; color: white;" class="btn btn-next" (click)="cancel()"
                *ngIf="successtitle === 'Error'"> Cancel</button>
            <button style="background: #2371CB; font-size: 15px; color: white;" class="btn btn-next"
                (click)="continue()" *ngIf="successtitle === ''">
                Continue</button>
        </div>
    </div>

    <ng-container *ngIf="showModal === modalType.REFERRAL_RATING">
        <app-referral-rating-popup [userType]="userType" (onSuccess)="receiveDataFromChild($event)"
            (onCancel)="cancelReviewRatingPopup()"></app-referral-rating-popup>
    </ng-container>

</app-modal>
