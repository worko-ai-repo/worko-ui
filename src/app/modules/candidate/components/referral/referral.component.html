<div class="row content-container">
    <!-- <button (click)="reverse()">Back</button> -->
    <div [ngClass]="{ 'hidden': !isAwaitingVisible}" class="left-container-content referral-candidate-left-container">
        <!-- divide-45 -->
        <app-awaiting-status [screenWidth]="screenWidth" [userType]="userType" (statusSelected)="onStatusSelected($event)" [referralList]="referralList" (showReferralDetails)="showReferralDetails($event)" (scrolledToBottom)="onScrollToBottom()">  </app-awaiting-status>
    </div>
    <div [ngClass]="{ 'hidden': !isMainContentVisible}" class="divide-55">
        <div class="row" style="height:100%">
            <app-referral-stepper [selectedReferral]="selectedReferral" [statusitem]="statusItem"  [isMainContentVisible]="isMainContentVisible"
            [isAwaitingVisible]="isAwaitingVisible" (onClickBack)="onClickBack()"></app-referral-stepper>
            <div class="status-container">
                <ng-container *ngIf="selectedStatus === 'AWAITING'; else otherStatus">
                    <app-new-request (markAsDone)="referralMarkAsDone($event)" (onWithdraw)="referralWithdraw($event)" [selectedReferral]="selectedReferral"></app-new-request>
                </ng-container>
                <ng-template #otherStatus>
                    <app-withdrawn-referral *ngIf="selectedStatus === 'WITHDRAWN'" [selectedReferral]="selectedReferral"></app-withdrawn-referral>
                    <app-referral-cancelled [userType]="userType" *ngIf="selectedStatus === 'CANCELLED'" [selectedReferral]="selectedReferral"></app-referral-cancelled>
                    <app-referral-req-rejected [userType]="userType" *ngIf="selectedStatus === 'REJECTED'" (markAsDone)="referralMarkAsDone($event)" [selectedReferral]="selectedReferral"></app-referral-req-rejected>
                    <app-accepted-referral [userType]="userType" *ngIf="selectedStatus === 'ACCEPTED'" [refereeDetails]="refereeDetails" (markAsDone)="referralMarkAsDone($event)" (raiseIssue)="referralRaiseIssue($event)" [selectedReferral]="selectedReferral"></app-accepted-referral>
                    <app-referral-req-done *ngIf="selectedStatus === 'REFERRED'" [userType]="userType" [processStatus]="processStatus" [refereeDetails]="refereeDetails" [reviewData]="reviewData" (referralRating)="createReview($event)" (markAsDone)="referralMarkAsDone($event)" (raiseIssue)="referralRaiseIssue($event)" [selectedReferral]="selectedReferral"></app-referral-req-done>
                </ng-template>
            </div>
        </div>
    </div>
</div>

<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
    [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
    [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'md'">

    <ng-container *ngIf="showModal === modalType.SUCCESS_ERROR_MESSAGE">
        <app-message-modal [title]="successTitle" [message]="successMessage" (onCancel)="cancel()" (onOk)="continue()">
        </app-message-modal>
    </ng-container>

    <ng-container *ngIf="showModal === modalType.REFERRAL_RATING">
        <app-referral-rating-popup [userType]="userType" (onSuccess)="receiveDataFromChild($event)"
            (onCancel)="cancelReviewRatingPopup()"></app-referral-rating-popup>
    </ng-container>

</app-modal>
