<div class="row content-container">
    <div class="left-container-content">
        <!-- divide-45 -->
        <app-awaiting-status (statusSelected)="onStatusSelected($event)" [referralList]="referralList" (showReferralDetails)="showReferralDetails($event)"> </app-awaiting-status>
    </div>
    <div class="divide-55">
        <div class="row" style="height:100%">
            <app-referral-stepper [selectedReferral]="selectedReferral"></app-referral-stepper>
            <div class="status-container">
                <ng-container *ngIf="selectedStatus === 'AWAITING'; else otherStatus">
                    <app-new-request (markAsDone)="referralMarkAsDone($event)" [selectedReferral]="selectedReferral"></app-new-request>
                </ng-container>
                <ng-template #otherStatus>
                    <app-referral-cancelled *ngIf="selectedStatus === 'CANCELLED'" [selectedReferral]="selectedReferral"></app-referral-cancelled>
                    <app-referral-req-rejected *ngIf="selectedStatus === 'REJECTED'" (markAsDone)="referralMarkAsDone($event)" [selectedReferral]="selectedReferral"></app-referral-req-rejected>
                    <app-accepted-referral [userType]="userType" *ngIf="selectedStatus === 'ACCEPTED'" (markAsDone)="referralMarkAsDone($event)" (referralRating)="referralReviewRating($event)" (raiseIssue)="referralRaiseIssue($event)" [selectedReferral]="selectedReferral"></app-accepted-referral>
                    <app-referral-req-done *ngIf="selectedStatus === 'DONE'" [userType]="userType" (markAsDone)="referralMarkAsDone($event)" (raiseIssue)="referralRaiseIssue($event)" [selectedReferral]="selectedReferral"></app-referral-req-done>
                </ng-template>
            </div>
        </div>
    </div>
</div>
