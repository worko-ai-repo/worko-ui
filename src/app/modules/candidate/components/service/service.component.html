<div class="row content-container">
    <div class="left-container-content">
        <app-all-services [servicesList]="servicesList" (statusSelected)="onStatusSelected($event)" (showSelectedService)="getSelectedService($event)" ></app-all-services>
    </div>
    <div class="divide-55">
        <div class="row" style="height:100%">
            <!-- <app-referral-stepper [selectedReferral]="selectedService"  *ngIf="servicesList.length"></app-referral-stepper> -->
            <app-referral-stepper [selectedReferral]="selectedService"></app-referral-stepper>
            <div class="status-container">
                <app-awaiting-service  *ngIf="selectedStatus === 'AWAITING' " [selectedService]="selectedService" (markAsDone)="referralMarkAsDone($event)"></app-awaiting-service>
                <app-payment-due  *ngIf="selectedStatus === 'PAYMENT_DUE'" [selectedService]="selectedService"></app-payment-due>
                <app-accepted  *ngIf="selectedStatus === 'ACCEPTED'" [selectedService]="selectedService" (markAsDone)="referralMarkAsDone($event)"></app-accepted>
                <app-service-rejected  *ngIf="selectedStatus === 'REJECTED'" [selectedService]="selectedService"></app-service-rejected>
                <app-cancelled-service  *ngIf="selectedStatus === 'CANCELLED'" [selectedService]="selectedService"></app-cancelled-service>
                <app-done-service  *ngIf="selectedStatus === 'DONE'" [selectedService]="selectedService"></app-done-service>
            </div>
        </div>
    </div>
</div>

<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
    [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
    [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'lg'">

    <!-- <app-messagmodal  [message]="successmessage" [title]="successtitle"></app-messagmodal> -->
    <div class="row message-card px-sm-3 p-4"
        style="border-radius: 6px;">
        <div class="font-weight-bold text-color-red mb-3 d-flex justify-content-center"
            style="color: #e40707; font-size: 20px;" *ngIf="successtitle === 'Alert!'">
            {{successtitle}}
        </div>
        <div class="font-weight-bold text-color-blue mb-3 d-flex justify-content-center" style="font-size: 20px;"
            *ngIf="successtitle === 'Congratulations!'">
            {{successtitle}}
        </div>

        <div class="d-flex justify-content-center" style="text-align: center; font-size: 19px;">
            <span>{{successmessage}}</span>
        </div>

        <div class=" mt-3 d-flex justify-content-center">
            <button style="background: #2371CB; font-size: 15px; color: white;" class="btn btn-next"
                (click)="okBtn()" *ngIf="successtitle">
                Ok</button>
        </div>
    </div>

</app-modal>
