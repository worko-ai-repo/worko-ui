<div class="card candidate-card">
    <div class="card-body">
        <div class="row">
            <div class="col-md-12">
                <h5 class="text-white">About</h5>
            </div>
            <div class="col-md-12">
                <p class="about-content">
                    {{userDescription}}
                </p>
            </div>
            <div class="certification-content text-white d-flex">
                <div class="certification-heading">Certifications:</div>
                <div class="p-1 certificate-label" *ngFor="let certificate of certificationList?.certifications">
                    <span class="certification-boxes">{{certificate.certName}}</span>
                </div>
            </div>
            <!-- <div class="row" > -->
            <!-- <div class="p-1" *ngFor="let certificate of certificationList?.certifications">
                <span class="certification-boxes">{{certificate.certName}}</span>
            </div> -->
            <!-- </div> -->
        </div>
    </div>
