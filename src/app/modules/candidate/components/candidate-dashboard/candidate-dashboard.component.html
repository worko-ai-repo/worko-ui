<div class="row content-container">
    <div class="container-top">
        <div class="divide-40 mr-3">
            <app-user-details [candidateDetails]=" candidateDetails" [educationDetails]="educationDetails" [workExperienceDetails]="workExperienceDetails"></app-user-details>
        </div>
        <div class="divide-60">
            <div class="row p-0" style="height:100%">
                <div style="width:60%">
                    <app-user-profile-complete [profileCompletion]="profileCompletion" [userType]="'Candidate'" [candidateSocial]="candidateSocial"></app-user-profile-complete>
                </div>
                <div style="width:40%;">
                    <app-user-soft-skills [softSkillsLists]="softSkillsLists"></app-user-soft-skills>
                </div>
            </div>
        </div>
    </div>
    <div class="container-bottom my-3"  style="height:100%">
        <div class="divide-40 mr-3"> <app-user-about [certificationList]="certificationList" [userDescription]="userDescription"></app-user-about></div>
        <div class="divide-60"> <app-user-skills  [achievementsList]="achievementsList" [coreSkillsLists]="coreSkillsLists" ></app-user-skills></div>
    </div>
</div>
