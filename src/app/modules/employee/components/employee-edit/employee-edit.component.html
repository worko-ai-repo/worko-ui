<div class="row content-container" >
    <div class="col-md-12">
      <div class="candidate-card">
        <div class="col-md-12">
          <app-user-stepper [currentStep]="currentStep" (nextStep)="nextStep()" (previousStep)="previousStep()"  [userType]="'Employee'"></app-user-stepper>
        </div>
        <div class="col-md-12">
          <app-employee-edit-details [employeeDetails]="employeeDetails" [employeeSocial]="employeeSocial" [employeePersonalData]="employeePersonalData" *ngIf="currentStep === 1" (nextStepSecond)="nextStepSecond($event)"></app-employee-edit-details>
          <app-employee-professional-details *ngIf="currentStep === 2" (nextStep)="nextStep()" [workExperienceDetails]="workExperienceDetails" [employeeProfessionalData]="employeeProfessionalData"   (nextStepThird)="nextStepThird($event)"(previousStep)="previousStep()"></app-employee-professional-details>
          <app-add-bank-details [bankInfo]="bankDetails" *ngIf="currentStep === 3" (previousStep)="previousStepSecond($event)" [employeeBankDetails]="employeeBankDetails" (onSuccess)="onSuccess($event)"></app-add-bank-details>
        </div>
      </div>
    </div>
  </div>
  
  <app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE"
[showClose]="true"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-4' : 'p-0'">

  <!-- <app-messagmodal  [message]="successmessage" [title]="successtitle"></app-messagmodal> -->
  <ng-container *ngIf="showModal === modalType.SUCCESS_MESSAGE">
  <!-- <div class="row message-card "> -->
    <div class="container message-card  ">
      <div class="px-sm-3">
      <div class="font-weight-bold text-color-blue mb-3 d-flex justify-content-center">
        {{successtitle}}
    </div>
  </div>
  <!-- <h2 class="d-flex justify-content-center">{{successtitle}}</h2> -->
      <!-- <h3 class="d-flex justify-content-center">{{successmessage}}</h3> -->
      <div class="d-flex justify-content-center"><span>{{successmessage}}</span> </div>
    
    
      <div class=" mt-3 d-flex justify-content-center" > 
        <button class="btn btn-next"  (click)="cancel()" *ngIf="successtitle === 'error'"> cancel</button>
        <button class="btn btn-next"  (click)="continue()" *ngIf="successtitle === 'success'"> continue</button>
    </div>
</div>
</ng-container>

</app-modal>
