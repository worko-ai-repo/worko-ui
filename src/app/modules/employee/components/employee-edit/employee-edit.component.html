<!-- <div class="row content-container"  > -->
<div [ngClass]="{'content-container': currentStep !== 1, 'no-height': currentStep === 1}" class="row">
  <div class="col-md-12">
    <div class="candidate-card">
      <div class="col-md-12">
        <app-user-stepper [currentStep]="currentStep" (nextStep)="nextStep()" (previousStep)="previousStep()"
          [userType]="'Employee'"></app-user-stepper>
      </div>
      <div class="col-md-12">
        <app-employee-edit-details *ngIf="currentStep === 1" [employeeDetails]="employeeDetails"
          [employeeSocial]="employeeSocial" [employeePersonalData]="employeePersonalData"
          (nextStepSecond)="nextStepSecond($event)"></app-employee-edit-details>
        <app-employee-professional-details *ngIf="currentStep === 2" (nextStep)="nextStep()"
          [workExperienceDetailsList]="workExperienceDetailsList" [workExperienceDetails]="workExperienceDetails"
          [employeeProfessionalData]="employeeProfessionalData" (nextStepThird)="nextStepThird($event)"
          (previousStep)="previousStep()"></app-employee-professional-details>
        <app-add-bank-details [bankInfo]="bankDetails" *ngIf="currentStep === 3"
          (previousStep)="previousStepSecond($event)" [employeeBankDetails]="employeeBankDetails"
          (onSuccess)="onSuccess($event)"></app-add-bank-details>
      </div>
    </div>
  </div>
</div>

<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'md'">

  <ng-container *ngIf="showModal === modalType.OTP_VERIFICATION">
    <app-otp-verification-modal *ngIf="showModal === modalType.OTP_VERIFICATION"
      (onSuccess)="receiveDataFromChild($event)" [email]="emailid"
      [id]="workExperienceDetails.id"></app-otp-verification-modal>
  </ng-container>

  <ng-container *ngIf="showModal === modalType.SUCCESS_ERROR_MESSAGE">
    <app-message-modal [title]="successTitle" [message]="successMessage" (onCancel)="cancel()"
      (onContinue)="continue()">
    </app-message-modal>
  </ng-container>

</app-modal>
