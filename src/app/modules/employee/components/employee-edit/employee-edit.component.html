<!-- <div class="row content-container"  > -->
  <div [ngClass]="{'content-container': currentStep !== 1, 'no-height': currentStep === 1}" class="row">
    <div class="col-md-12">
      <div class="candidate-card">
        <div class="col-md-12">
          <app-user-stepper [currentStep]="currentStep" (nextStep)="nextStep()" (previousStep)="previousStep()"  [userType]="'Employee'"></app-user-stepper>
        </div>
        <div class="col-md-12">
          <app-employee-edit-details *ngIf="currentStep === 1" [employeeDetails]="employeeDetails" [employeeSocial]="employeeSocial" [employeePersonalData]="employeePersonalData" (nextStepSecond)="nextStepSecond($event)"></app-employee-edit-details>
          <app-employee-professional-details *ngIf="currentStep === 2" (nextStep)="nextStep()"[workExperienceDetailsList]="workExperienceDetailsList" [workExperienceDetails]="workExperienceDetails" [employeeProfessionalData]="employeeProfessionalData"   (nextStepThird)="nextStepThird($event)" (previousStep)="previousStep()"></app-employee-professional-details>
          <app-add-bank-details [bankInfo]="bankDetails" *ngIf="currentStep === 3" (previousStep)="previousStepSecond($event)" [employeeBankDetails]="employeeBankDetails" (onSuccess)="onSuccess($event)"></app-add-bank-details>
        </div>
      </div>
    </div>
  </div>
  
  <app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'md'">
  
  <div class="row message-card px-sm-3 p-4" >
  
      <div class="font-weight-bold text-color-red mb-3 d-flex justify-content-center" style="color: #e40707; font-size: medium;" *ngIf="successtitle === 'Error'">
          {{successtitle}}
      </div>
      <div class="font-weight-bold text-color-blue mb-3 d-flex justify-content-center" *ngIf="successtitle === 'Congratulations!'">
        {{successtitle}}
    </div>

      <div class="d-flex justify-content-center"><span>{{successmessage}}</span> </div>

      <div class=" mt-3 d-flex justify-content-center">
          <button class="btn btn-next" (click)="cancel()" *ngIf="successtitle === 'Error'"> Close</button>
          <button class="btn btn-next" (click)="continue()" *ngIf="successtitle === 'Congratulations!'">
              Continue</button>
      </div>
  </div>


</app-modal>
