<div class="row" style="margin-left: 216px;">
    <div class="col-md-12">
      <div class="candidate-card">
        <div class="col-md-12">
          <app-user-stepper [currentStep]="currentStep" (nextStep)="nextStep()" (previousStep)="previousStep()"></app-user-stepper>
        </div>
        <div class="col-md-12">
          <app-employee-edit-details [employeeDetails]="employeeDetails" [employeeSocial]="employeeSocial" [employeePersonalData]="employeePersonalData" *ngIf="currentStep === 1" (nextStepSecond)="nextStepSecond($event)"></app-employee-edit-details>
          <app-employee-professional-details *ngIf="currentStep === 2" (nextStep)="nextStep()" [workExperienceDetails]="workExperienceDetails" [employeeProfessionalData]="employeeProfessionalData"   (nextStepThird)="nextStepThird($event)"(previousStep)="previousStep()"></app-employee-professional-details>
          <app-add-bank-details [bankInfo]="bankDetails" *ngIf="currentStep === 3" (previousStep)="previousStep()"  (onSuccess)="onSuccess($event)"></app-add-bank-details>
        </div>
      </div>
    </div>
  </div>
