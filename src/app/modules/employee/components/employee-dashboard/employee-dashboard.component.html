

<div class="container-fluid" >
  <div class="row" style="margin-left: 190px;">
    <div class="col-md-12">
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-6">
            <app-employee-details [candidateDetails]=" candidateDetails" [educationDetails]="educationDetails" [workExperienceDetails]="workExperienceDetails"></app-employee-details>
          </div>
          <div class="col-md-5">
            <app-user-profile-complete [profileCompletion]="profileCompletion" [userType]="'Employee'" [candidateSocial]="candidateSocial"></app-user-profile-complete>
  
          </div>
        </div>
      </div>

     <div class="container-fluid">
      <div class="row mt-2">
        <div class="col-md-5">
          <app-job-history [workExperienceDetails]="workExperienceDetails"></app-job-history>
        </div>
        <div class="col-md-6">
          <app-service-package></app-service-package>
        </div>
      </div>
     </div>
      
     <div class="container-fluid">
      <div class="row">
        <div class="col-md-11">
          <app-bank-details [bankInfo]="bankDetails"></app-bank-details>
        </div>
      </div>
     </div>
    </div>
  </div>
</div>
