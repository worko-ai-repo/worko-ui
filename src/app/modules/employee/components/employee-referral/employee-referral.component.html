<div class="row content-container">
    <div class="left-container-content">
        <app-awaiting-status [userType]="userType" (statusSelected)="onStatusSelected($event)" [referralList]="empReferralList"
            (showReferralDetails)="showReferralDetails($event)"></app-awaiting-status>
    </div>
    <div class="divide-55">
        <div class="row" style="height:100%">
            <app-referral-stepper [selectedReferral]="selectedReferral"></app-referral-stepper>
            <div class="status-container">
                <ng-container *ngIf="selectedStatus === 'AWAITING'; else otherStatus">
                    <app-employee-referral-details (onAccept)="referralAction('ACCEPT')"
                        (onReject)="rejectAction('REJECT', $event)" [selectedStatus]="selectedStatus"
                        [selectedReferral]="selectedReferral" [empExperienceList]="empExperienceList"
                        [empExperienceDetails]="empExperienceDetails" [empCoreSkillsList]="empCoreSkillsList"
                        [empCoreSkillsDetails]="empCoreSkillsDetails" [empAchievmentsList]="empAchievmentsList"
                        [empAchievmentsDetails]="empAchievmentsDetails" [empEducationList]="empEducationList"
                        [empEducationDetails]="empEducationDetails" [empdetailsList]="empdetailsList"
                        [empDetails]="empDetails"></app-employee-referral-details>
                </ng-container>

                <ng-template #otherStatus>
                    <app-employee-referral-details [selectedStatus]="selectedStatus"
                        [empExperienceList]="empExperienceList" [empExperienceDetails]="empExperienceDetails"
                        [empCoreSkillsList]="empCoreSkillsList" [empCoreSkillsDetails]="empCoreSkillsDetails"
                        [empAchievmentsList]="empAchievmentsList" [empAchievmentsDetails]="empAchievmentsDetails"
                        [empEducationList]="empEducationList" [empEducationDetails]="empEducationDetails"
                        [empdetailsList]="empdetailsList" [empDetails]="empDetails"
                        *ngIf="selectedStatus === 'REJECTED'"></app-employee-referral-details>
                    <app-referral-done *ngIf="selectedStatus === 'DONE'" [userType]="userType"
                        (raiseIssue)="referralRaiseIssue($event)" [reviewData]="reviewData"
                        [empdetailsList]="empdetailsList" [selectedReferral]="selectedReferral"></app-referral-done>
                    <app-referral-cancelled *ngIf="selectedStatus === 'CANCELLED'"></app-referral-cancelled>

                </ng-template>

            </div>
        </div>
    </div>
</div>


<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
    [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
    [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="'md'">

    <!-- <app-messagmodal  [message]="successmessage" [title]="successtitle"></app-messagmodal> -->
    <div class="row message-card px-sm-3 p-4" style="border-radius: 6px;">
        <div class="font-weight-bold text-color-red mb-3 d-flex justify-content-center"
            style="color: #e40707; font-size: 20px;" *ngIf="successtitle === 'Error'">
            {{successtitle}}
        </div>
        <div class="font-weight-bold text-color-blue mb-3 d-flex justify-content-center" style="font-size: 20px;"
            *ngIf="successtitle === 'Congratulations!'">
            {{successtitle}}
        </div>

        <div class="d-flex justify-content-center" style="text-align: center; font-size: 19px;">
            <span>{{successmessage}}</span>
        </div>

        <div class=" mt-3 d-flex justify-content-center">
            <button style="background: #2371CB; font-size: 15px; color: white;" class="btn btn-next" (click)="cancel()"
                *ngIf="successtitle === 'Error'"> Cancel</button>
            <button style="background: #2371CB; font-size: 15px; color: white;" class="btn btn-next"
                (click)="continue()" *ngIf="successtitle === 'Congratulations!'">
                Continue</button>
        </div>
    </div>


</app-modal>
