 <div class="row content-container">
    <div class="container">
     <div class="row">
        <div class="col-4">
            <app-awaiting-status  (statusSelected)="onStatusSelected($event)" [referralList]="empReferralList"  (showReferralDetails)="showReferralDetails($event)"></app-awaiting-status>
        </div>
        <div class="col-md-8">
            <div class="row">
                <div class="col-md-12">
                    <app-referral-stepper></app-referral-stepper>
                </div>

                <div class="col-md-12">
                    <ng-container *ngIf="selectedStatus === 'AWAITING'; else otherStatus">
                        <app-employee-referral-details (onAccept)="referralAction('ACCEPT')" (onReject)="referralAction('REJECT')" [selectedStatus]="selectedStatus"
                        [empExperienceList]="empExperienceList" [empExperienceDetails]="empExperienceDetails" [empCoreSkillsList]="empCoreSkillsList" [empCoreSkillsDetails]="empCoreSkillsDetails"
                        [empAchievmentsList]="empAchievmentsList" [empAchievmentsDetails]="empAchievmentsDetails" 
                        [empEducationList]="empEducationList" [empEducationDetails]="empEducationDetails"  [empdetailsList]="empdetailsList" [empDetails]="empDetails"></app-employee-referral-details>
                    </ng-container>
                   
                    <ng-template #otherStatus>
                        <app-employee-referral-details [selectedStatus]="selectedStatus" 
                        [empExperienceList]="empExperienceList" [empExperienceDetails]="empExperienceDetails" [empCoreSkillsList]="empCoreSkillsList" [empCoreSkillsDetails]="empCoreSkillsDetails"
                        [empAchievmentsList]="empAchievmentsList" [empAchievmentsDetails]="empAchievmentsDetails" 
                        [empEducationList]="empEducationList" [empEducationDetails]="empEducationDetails"  [empdetailsList]="empdetailsList" [empDetails]="empDetails"
                        *ngIf="selectedStatus === 'REJECTED'"></app-employee-referral-details>
                        <app-referral-done  *ngIf="selectedStatus === 'DONE'"></app-referral-done>
                        <app-referral-cancelled *ngIf="selectedStatus === 'CANCELLED'"></app-referral-cancelled>

                    </ng-template>
                   
                </div>
            </div>
        </div>
     </div>
   
</div>
