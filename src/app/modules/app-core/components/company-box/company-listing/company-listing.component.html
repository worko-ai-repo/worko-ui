<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      <app-navbar></app-navbar>
    </div>
  </div>

  <div class="row ms-5 mt-5 ps-4 me-0">
    <div class="col-md-12">
      <div class="referred">Get referred to over 1000+ companies</div>
    </div>
    <div class="col-md-8 paraReferral">
      <p>
        Select a company you want a referral for. Enter the URL for the job
        posting that you want, and send your profile off to our referral
      </p>
    </div>
  </div>

  <div class="row ms-4 ms-0 ps-0">
    <div class="col-md-8 ms-5 text-white" style="top: -3rem">
      <input class="searchInput" placeholder="Search by company name..."
        style="background: linear-gradient(148deg, #000 5.99%, #182b45 70.16%)" />
    </div>
    <!-- <div class="input-group-append">
      <span class="input-group-text"><i class="fas fa-search"></i></span>
  </div> -->
  </div>

  <div class="row ms-3">
    <div class="col-md-4 campanies">
      <div style="font-size: large; width: 200px">Campanies</div>
    </div>
    <div class="col-md-2 me-3" style="border: 1px solid #73ddff; border-radius: 5px; text-align: center">
      <select name="" id="" style="background-color: transparent; border: none; color: white">
        <option value="">Industry</option>
      </select>
    </div>
    <div class="col-md-2 me-3" style="border: 1px solid #73ddff; border-radius: 5px; text-align: center">
      <select name="" id="" style="background-color: transparent; border: none; color: white">
        <option value="">Team Size</option>
      </select>
    </div>
    <div class="col-md-2 me-3" style="border: 1px solid #73ddff; border-radius: 5px; text-align: center">
      <select name="" id="" style="background-color: transparent; border: none; color: white">
        <option value="">Company name</option>
      </select>
    </div>
  </div>

  <div class="row p-3 ms-3 d-flex justify-contain-center">
    <div class="m-3 zoom-box " *ngFor="let item of companyarry">


      <div class="haver">
        <div class="logo-image">
          <div class="brand-image">
            <img src="{{ item.image }}" alt="" />
          </div>
        </div>

        <div class="  company-box">
          <div class="row card">
            <div class="col-6">
              <img class="mt-4 pt-3 "
                src="https://th.bing.com/th/id/R.4aa108082e7d3cbd55add79f84612aaa?rik=I4dbPhSe%2fbHHSg&riu=http%3a%2f%2fpurepng.com%2fpublic%2fuploads%2flarge%2fpurepng.com-google-logo-2015brandlogobrand-logoiconssymbolslogosgoogle-6815229372333mqrr.png&ehk=ewmaCOvP0Ji4QViEJnxSdlrYUrTSTWhi8nZ9XdyCgAI%3d&risl=&pid=ImgRaw&r=0">
            </div>
        
            <div class="col-6 mt-3">
              <button class="btn btn-outline-dark btn-sm listing-button" style="font-size: 12px;">Linkedin</button>
              <button class="mt-2 btn btn-outline-dark btn-sm listing-button" style="font-size: 10px;">Career page</button>
            </div>
          </div>
          <div class="row buttons-referral" style="margin-top: -10px;">
            <div class="d-flex p-0">
              <div class="col-md-6 p-0">
                <button class="btn btn-sm bg-white request-button listing-button"
                  style="font-size: 10px;white-space: nowrap;">Request Referral</button>
              </div>
              <div class="col-md-6 p-0">
                <button class="btn btn-sm bg-white long-button listing-button"
                  style="font-size: 10px;white-space: nowrap;">Request Guidance</button>
              </div>
            </div>
          </div>
        </div>

          <div class="col-md-6 p-0">
            <button class="btn btn-outline-dark btn-sm bg-white "
              style="font-size: 10px;white-space: nowrap;">Request Referrel</button>
          </div>
          <div class="col-md-6 p-0">
            <button class="btn btn-outline-dark btn-sm bg-white "
              style="font-size: 10px;white-space: nowrap;">Request Guidence</button>
          </div>
        </div> -->
      </div>
    </div>
  </div>
