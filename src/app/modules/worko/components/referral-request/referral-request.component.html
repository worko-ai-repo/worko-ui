<div class="row">
<div class="body main-div">
  <div class="row" *ngIf="showReferrelRow">

    <div class="col-md-6">
      <div class="refeeral-img"></div>
      <img src="/assets/public/referral-main1.png" class="hand-img ms-1" alt="" />
    </div>

    <div class="col-md-6 d-flex align-self-center">
      <div class="row h-100">
        <div class="col-md-12">
          <h1 class="ref-req-text">Referral Request</h1>
        </div>

        <form (ngSubmit)="requestReferral.form.valid && checkRequestReferral(requestReferral)" #requestReferral="ngForm"
          class="p-0" novalidate>

          <div class="col-md-12 pt-4">
            <p class="job-url-text">Enter job Url</p>
          </div>
          <!-- patter="/^(https?:\/\/)?([\w.-]+)\.([a-z]{2,})(\/\S*)?$/i;" -->
          <div class="col-md-12">
            <input type="text" #jobUrl="ngModel" pattern="^[0-9]{6}$"
              [class.invalid]="(requestReferral.submitted || jobUrl.touched) && jobUrl.invalid"
              [(ngModel)]="requestForm.jobUrl" name="jobUrl" id="jobUrl"
              [title]="jobUrl.errors?.['pattern'] ? 'Job Url is invalid' : ''"
              class="form-control text-white input-jobUrl" />
          </div>
          <div class="col-md-12 py-4">
            <button class="btn req-btn" type="submit" [disabled]="(!requestReferral.form.valid || !requestForm.jobUrl)" (click)="subPack()">
              REQUEST NOW  
              
            </button>


          </div>
        </form>
      </div>
    </div>
  </div>
  
   
 


  <div class="col-md-12" *ngIf="showSubscription">
    <div class="row">
      <div class="col-md-12 mt-4">
        <h1 class="subscrip-text">
          Select the <br/>
          Subscription Plan
        </h1>
      </div>

      <div class="col-md-12">
        <app-subscription-pack  (onSuccess)="receiveDataFromChild($event)" (onError)="receieveError($event)"></app-subscription-pack> 

      </div>
      

      
      
    </div>

    <!-- <div class="row mt-3">
      <div class="col-md-4"*ngFor="let subscription of subscriptionList" >
         <app-subscription-pack  [package]="subscription"  (onSuccess)="receiveDataFromChild($event)" (onError)="receieveError($event)"></app-subscription-pack> 
       

      </div>
    </div> -->
  </div>

  <!-- <div class="row" *ngIf="showLoading">
    <div class="col-md-12 text-center mt-5" *ngIf="showLoading">
      <img src="/assets/public/gif-img.gif" class="gif-img" alt="searching">
    </div>
  </div> -->

  <!-- <div class="progress-bar" *ngIf="showScore">
    <app-referral-progress-bar [score]="matchingScore"></app-referral-progress-bar>
  </div> -->

</div>
</div>
