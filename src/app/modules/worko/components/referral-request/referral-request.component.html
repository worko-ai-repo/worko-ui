<div class="row">
  <div class="body main-div">
    <div class="row" *ngIf="showReferrelRow">
      <div class="col-sm-6">
        <div class="refeeral-img"></div>
        <img src="/assets/public/referral-main1.png" class="hand-img ms-1" alt="" />
      </div>

      <div class="col-sm-6 d-flex align-self-center">
        <div class="row h-100">
          <div class="col-sm-12  title">
            <h1 class="ref-req-text">Referral Request</h1>
          </div>

          <form (ngSubmit)="checkRequestReferral()" [formGroup]="requestForm" class="p-0" novalidate>
            <div class="col-sm-12 mt-lg-3 mt-sm-1">
              <label for="jobUrl" class="form-lable required-form-field">Enter job URL for {{selectedCompany.name}}</label>
              <input formControlName="jobUrl" id="jobUrl" type="text" class="form-control text-white input-jobUrl" />
              <div *ngIf="requestForm.get('jobUrl')?.invalid && (requestForm.get('jobUrl')?.dirty || requestForm.get('jobUrl')?.touched)" class="text-danger">
                Please enter a valid URL.
              </div>
            </div>
          
            <div class="col-md-12">
              <label for="jobDescription" class="form-lable required-form-field">Enter job description</label>
              <textarea formControlName="jobDescription" minlength="100" id="jobDescription" class="form-control text-white input-jobDescription"  style="max-height: 100px;"></textarea>
              <div *ngIf="requestForm.get('jobDescription')?.invalid && (requestForm.get('jobDescription')?.dirty || requestForm.get('jobDescription')?.touched) &&requestForm.get('jobDescription')?.errors?.['notEnoughKeywords']" class="text-danger">
                Please enter a  valid job description.
              </div>
              
            </div>
          
            <div class="col-sm-12 py-3">
              <button class="btn req-btn" type="submit" [disabled]="!requestForm.valid">REQUEST NOW</button>
            </div>
          </form>
          
        </div>
      </div>
    </div>

    <div class="col-sm-12" *ngIf="showSubscription">
      <div class="row">
        <div class="col-sm-12 mt-4">
          <h1 class="subscrip-text">
            Select the <br/>
            Subscription Plan
          </h1>
        </div>
        <div class="col-sm-12">
          <app-subscription-pack  (onSuccess)="receiveDataFromChild($event)" (onError)="receieveError($event)"></app-subscription-pack> 
        </div>
      </div>
    </div>

    <!-- <div class="row" *ngIf="showLoading">
      <div class="col-md-12 text-center mt-5" *ngIf="showLoading">
        <img src="/assets/public/gif-img.gif" class="gif-img" alt="searching">
      </div>
    </div> -->

    <div class="progress-bar" *ngIf="showScore">
      <app-referral-progress-bar  [referralId]="referralRequestId"></app-referral-progress-bar>
    </div>
  </div>
</div>
