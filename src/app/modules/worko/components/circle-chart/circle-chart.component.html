<div *ngIf="isEmployeeReferralPage; else elseBlock"
  class="circle-chart-container d-flex align-self-center justify-content-center ">
  <mat-progress-spinner class="circle-chart-referral" [ngClass]="{ 'hide-progress-bar': hideProgressBar }"
    [class.red]="getColor() === 'red'" mode="determinate" [value]="chartValue" [diameter]="105">
  </mat-progress-spinner>
  <div class="circle-chart-text-referral">{{ chartText }}/100</div>
</div>

<ng-template #elseBlock>
  <div
    class="circle-chart-container d-flex align-self-center justify-content-center ">
    <mat-progress-spinner class="circle-chart" [ngClass]="{ 'hide-progress-bar': hideProgressBar }"
      [class.red]="getColor() === 'red'" mode="determinate" [value]="chartValue" [diameter]="160">
    </mat-progress-spinner>
    <div class="circle-chart-text" [ngStyle]="{'font-size': getFontSize(chartValue)}">
      {{ chartText }}/100
    </div>
  </div>
</ng-template>
