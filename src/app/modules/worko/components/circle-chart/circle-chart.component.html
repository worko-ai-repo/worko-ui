<div class="circle-chart-container d-flex align-self-center justify-content-center ">
    <mat-progress-spinner
      class="circle-chart"
      [ngClass]="{ 'hide-progress-bar': hideProgressBar }"
      [color]="getColor()"
      mode="determinate"
      [value]="chartValue"
      [diameter]="150"
    >
    </mat-progress-spinner>
    <div class="circle-chart-text">{{ chartText }}/10</div>
  </div>
