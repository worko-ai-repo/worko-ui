<div class="container-fluid mini-job-container position-relative">
    <div class="top-header-bg">
        <img src="assets/public/logo_bg.png" alt="">
    </div>
    <div class="row">
        <div class="col-12">
            <app-navbar></app-navbar>
        </div>
    </div>

<div class="mini-job-main-container">
    <div class="row mt-4 contents">
        <div class="col-10 ms-5 col-md-12">
            <div class="mini-job-headline">Get Direct Referral to {{companyName}}:</div>
        </div>
    </div>

    <div class="row content-container">
        <!-- Left Column (55%) -->
        <div class="col-md-7 col-12 divide-55">
            <div class="mini-job-title-container">
                <app-mini-job-portal-title ></app-mini-job-portal-title>
            </div>
            <div class="mini-job-description-container">
                <app-mini-job-portal-description></app-mini-job-portal-description>
            </div>
            <div class="mini-job-about-container">
                <app-mini-job-portal-about-company></app-mini-job-portal-about-company>
            </div>
        </div>

        <!-- Right Column (45%) -->
        <div class="col-md-5 col-12 divide-45">
            <div class="mini-job-skills-container">
                <app-mini-job-portal-skills></app-mini-job-portal-skills>
            </div>
            <div class="mini-job-otherjob-container">
                <app-mini-job-portal-otherjob></app-mini-job-portal-otherjob>
            </div>
        </div>
    </div>
</div>
</div>
