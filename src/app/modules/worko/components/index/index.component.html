<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="false"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-4' : 'p-0'">
  <ng-container *ngIf="showModal === modalType.LOGIN_SIGNUP ">
    <app-login-page (onSuccess)="receiveDataFromChild($event)" [userType]="selectedUserType"></app-login-page>
  </ng-container>
</app-modal>
