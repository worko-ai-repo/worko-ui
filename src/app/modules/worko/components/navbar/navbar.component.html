 <header>
  <nav class="navbar navbar-dark font-inria navbar-expand-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="Javascript:;"><img class="worko-logo-ai-2-icon" alt=""
          src="assets/public/workologoai-2@2x.png" /></a>
      <button class="navbar-toggler" type="button" (click)="toggleCollapse()" [attr.aria-expanded]="isCollapsed ? 'true' : 'false'" aria-controls="navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" [ngClass]="{'show': !isCollapsed}" id="navbarSupportedContent">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#" (click)="isCollapsed = !isCollapsed">About Us</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" (click)="isCollapsed = !isCollapsed" [attr.aria-expanded]="isCollapsed ? 'true' : 'false'" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
              FAQ’s
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">FAQ</a></li>
              <li><a class="dropdown-item" href="#">FAQ</a></li>
            </ul>
          </li>
          <li class="nav-item">
            <a class="nav-link" (click)="isCollapsed = !isCollapsed">Corporate</a>
          </li>
        </ul>
        <div class="d-flex -pointer user-icon-container" role="search"  *ngIf="!userLoggedIn" (click)="openLogin()">
          <img class="user-icon" _ngcontent-ng-c280476550="" alt="" src="assets/public/iconamoonprofilecirclefill.svg">
        </div>
        <div class="d-flex"   *ngIf="userLoggedIn" (click)="logout()">
          Logout
        </div>
      </div>
    </div>
  </nav>
</header>
 <app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="true"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-4' : 'p-0'">
  <ng-container *ngIf="showModal === modalType.LOGIN_SIGNUP">
    <app-login-page (onSuccess)="receiveDataFromChild($event)" ></app-login-page>
  </ng-container>
</app-modal>
