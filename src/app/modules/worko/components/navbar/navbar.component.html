<!-- Dropdown add -->

<nav class="navbar">
  <div class="navbar-container container">
      <input type="checkbox" name="" id="">
      <div class="hamburger-lines">
          <span class="line line1"></span>
          <span class="line line2"></span>
          <span class="line line3"></span>
      </div>
      <ul class="menu-items">
          <li><a href="/about-us">About Us</a></li>
          <li class="has-children" (click)="toggleSubMenu()" (mouseenter)="showSubMenuOnHover()" (mouseleave)="hideSubMenuOnHover()" >
            FAQ's<span class="caret"></span>
            <ul class="children" [hidden]="!showSubMenu" (mouseenter)="showSubMenuOnHover()" (mouseleave)="hideSubMenuOnHover()">
          
              <li><a href="#">FAQ's for Candidate</a></li>
              <li><a href="#">FAQ's for Referee</a></li>

            </ul>
          </li>

          <li><a href="#">Corporate</a></li>
          <li class="icon-lg">
            <div class="d-flex -pointer user-icon-container" *ngIf="!userLoggedIn" (click)="openLogin()">
              <img class="user-icon" _ngcontent-ng-c280476550="" alt="" src="assets/public/iconamoonprofilecirclefill.svg">
            </div>
          </li>

          <li class="text-sm" *ngIf="!this.userLoggedIn">
            <a (click)="openLogin()" style="cursor: pointer;">Signin</a>
          </li>

          
          <li class="text-sm" *ngIf="this.userLoggedIn">
            <a style="cursor: pointer;" (click)="logout()">Log Out</a>
          </li>
      </ul>
      <a class="navbar-brand" href="/"><img class="worko-logo-ai-2-icon" alt=""
        src="assets/public/workologoai-2@2x.png" />
      </a>

  </div>
</nav>


</header>
<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="true"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-4' : 'p-0'">
  <ng-container *ngIf="showModal === modalType.LOGIN_SIGNUP">
    <app-login-page (onSuccess)="receiveDataFromChild($event)"></app-login-page>
  </ng-container>
</app-modal>
