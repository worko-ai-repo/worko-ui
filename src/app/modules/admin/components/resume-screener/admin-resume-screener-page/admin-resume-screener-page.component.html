<div class="main-container mx-3">
  <div class="page-top-content">
    <div class="page-title">
      <h1>AI-Powered Resume Screener for Faster, Smarter Hiring</h1>
    </div>
    <div class="page-info">
      <h5>
        Effortlessly screen resumes with precision using Worko’s AI-Powered Resume Screener.
        Screen up to 1000 resumes in minutes and get an accurate, ranked list of top
        candidates for your job openings.
      </h5>
    </div>
  </div>

  <app-job-description (jdValidationChange)="updateJDValidation($event)" (jdTextChange)="updateJDText($event)"
    [jobDescription]="getHtmlInnerText(jobDetails?.jobDescription)">
  </app-job-description>

  <button class="btn ps-4 pe-4 btn screen-resumes-btn" style="margin-bottom: 20px;" [disabled]="!isValidJD"
    *ngIf="showFetchDetailsButton" (click)="fetchDetails()">
    Fetch Details
  </button>

  <app-resume-screener-form #resumeFormRef [userType]="'ADMIN'" [mustHavesInput]="mustHaves"
    [goodToHavesInput]="goodToHaves" [mustNotHavesInput]="mustNotHaves"
    [fieldsDisabled]="fieldsDisabled"></app-resume-screener-form>

  <app-resume-uploader (resumeUploadChange)="updateResumeUploadStatus($event)"
    (uploadedFilesChange)="updateUploadedFiles($event)">
  </app-resume-uploader>

  <button class="ps-4 pe-4 btn screen-resumes-btn"
    [disabled]="!isValidJD || !isResumeUploaded || !resumeFormComponent.isFormValid()" (click)="submitCriteria()">
    Screen Resumes
  </button>
</div>


<app-modal [theme]="'theme-k'" [centered]="true" [showHeader]="showModal === modalType.MESSAGE" [showClose]="showClose"
  [showFooter]="showModal === modalType.MESSAGE" [title]="modalTitle" [message]="modalMessage"
  [bodyClass]="modalMessage ? 'p-4' : 'p-0'" [modalSize]="modalSize">

  <!-- Success Message Modal -->
  <ng-container *ngIf="showModal=== modalType.SUCCESS_MESSAGE">
    <div class="row message-card px-sm-3 p-4">
      <div class="font-weight-bold text-color-red mb-3 d-flex justify-content-center"
        style="color: #e40707; font-size: medium;" *ngIf="successTitle === 'Error'">
        {{successTitle}}
      </div>

      <div class="d-flex justify-content-center"><span>{{successMessage}}</span> </div>

      <div class=" mt-3 d-flex justify-content-center">
        <button class="btn btn-next" (click)="closeModal()" *ngIf="successTitle === 'Error'"> Close</button>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="showModal === modalType.SUCCESS_ERROR_MESSAGE">
    <app-message-modal [title]="successTitle" [message]="successMessage" (onOk)="continue()" (onCancel)="closeModal()">
    </app-message-modal>
  </ng-container>

</app-modal>
